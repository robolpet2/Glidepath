<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#f6f7fb}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),W=1920,H=1080,CX=W/2,CY=H/2;
const CY1='#00c8ff',MG='#ff2bd6',OR='#ff7a1a',VI='#7b5cff',INK='#141428';
function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
const R=rng(42);
const P=[...Array(260)].map(()=>({x:R()*W,y:R()*H,z:R()*1+.2,h:[CY1,MG,OR,VI][R()*4|0],a:R()*6.28}));
const code=["const agent = await claude.spawn({ mode: 'ultra' });","for (const task of plan.tasks) agent.run(task);","export async function ship(repo) {","  const diff = await think(repo.issues);","  await tests.pass(diff) && deploy(diff);","}","// refactored 4,812 lines in 3.2s","type Thought = Speed & Precision;","await Promise.all(agents.map(a => a.solve()));","git commit -m \"feat: everything\"","✓ 1,024 tests passed","const future = build(imagination);"];
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3),eio=t=>t<0?0:t>1?1:t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{t=Math.max(0,Math.min(1,t));const s=1.9;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),seg=(t,a,b)=>cl((t-a)/(b-a),0,1);
function glow(col,b){x.shadowColor=col;x.shadowBlur=b}
function noGlow(){x.shadowBlur=0}
function grad(x0,y0,x1,y1){const g=x.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,CY1);g.addColorStop(.5,VI);g.addColorStop(1,MG);return g}
function bg(t,speed){
  const g=x.createRadialGradient(CX,CY,0,CX,CY,1200);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#e9ecf7');x.fillStyle=g;x.fillRect(0,0,W,H);
  // perspective grid floor + ceiling
  x.save();x.lineWidth=1.2;const off=(t*speed*120)%80;
  for(const dir of[1,-1]){
    for(let i=0;i<14;i++){const zz=(i*80+off)/1120;const y=CY+dir*(40+Math.pow(zz,2.2)*520);x.strokeStyle=`rgba(123,92,255,${.05+zz*.18})`;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}
    for(let i=-16;i<=16;i++){x.strokeStyle='rgba(0,200,255,.10)';x.beginPath();x.moveTo(CX+i*18,CY+dir*40);x.lineTo(CX+i*190,CY+dir*600);x.stroke();}
  }x.restore();
  // particles drifting toward camera
  for(const p of P){p.z+=0.004*speed;if(p.z>1.4){p.z=.2;p.x=R()*W;p.y=R()*H}
    const k=p.z*p.z,px=CX+(p.x-CX)*k*1.3,py=CY+(p.y-CY)*k*1.3,r=1+k*3;
    x.globalAlpha=cl(k,0,.8);x.fillStyle=p.h;x.beginPath();x.arc(px,py,r,0,7);x.fill();
    if(speed>3){x.strokeStyle=p.h;x.lineWidth=r*.8;x.beginPath();x.moveTo(px,py);x.lineTo(CX+(px-CX)*.9,CY+(py-CY)*.9);x.stroke();}}
  x.globalAlpha=1;
}
function star(t,cx,cy,s,rot,a){ // claude-like burst mark
  x.save();x.translate(cx,cy);x.rotate(rot);x.globalAlpha=a;glow(OR,40);
  for(let i=0;i<12;i++){x.rotate(Math.PI/6);const L=s*(i%2?.78:1);x.fillStyle=i%3==0?OR:i%3==1?MG:CY1;
    x.beginPath();x.moveTo(0,-s*.08);x.quadraticCurveTo(L*.5,-s*.07,L,0);x.quadraticCurveTo(L*.5,s*.07,0,s*.08);x.fill();}
  noGlow();x.fillStyle='#fff';x.beginPath();x.arc(0,0,s*.14,0,7);x.fill();x.restore();
}
function ring(cx,cy,r,col,w,a){x.save();x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=w;glow(col,25);x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();x.restore()}
function word(txt,size,y,{sc=1,a=1,sk=0,ls=0,col=null,cx=CX,stroke=false}={}){
  x.save();x.translate(cx,y);x.scale(sc,sc);x.transform(1,0,sk,1,0,0);x.globalAlpha=a;
  x.font=`900 ${size}px "Inter","Helvetica Neue",Arial,sans-serif`;x.textAlign='center';x.textBaseline='middle';
  if(ls)x.letterSpacing=ls+'px';
  const w=x.measureText(txt).width;
  // chromatic split
  x.globalCompositeOperation='multiply';
  x.fillStyle='rgba(0,200,255,.55)';x.fillText(txt,-5,0);x.fillStyle='rgba(255,43,214,.55)';x.fillText(txt,5,0);
  x.globalCompositeOperation='source-over';
  glow(col||VI,30);x.fillStyle=col||grad(-w/2,0,w/2,0);x.fillText(txt,0,0);noGlow();
  if(stroke){x.strokeStyle='#fff';x.lineWidth=2;x.strokeText(txt,0,0)}
  x.restore();
}
function flash(a,col='#fff'){if(a<=0)return;x.globalAlpha=a;x.fillStyle=col;x.fillRect(0,0,W,H);x.globalAlpha=1}
function panel(px,py,w,h,t,seed,a){
  x.save();x.globalAlpha=a;x.translate(px,py);
  glow('rgba(123,92,255,.5)',40);x.fillStyle='rgba(255,255,255,.88)';rr(-w/2,-h/2,w,h,22);x.fill();noGlow();
  x.strokeStyle=grad(-w/2,0,w/2,0);x.lineWidth=2.5;rr(-w/2,-h/2,w,h,22);x.stroke();
  [MG,OR,CY1].forEach((c2,i)=>{x.fillStyle=c2;x.beginPath();x.arc(-w/2+30+i*24,-h/2+26,7,0,7);x.fill()});
  x.font='600 22px "JetBrains Mono",Menlo,monospace';x.textAlign='left';x.textBaseline='top';
  const chars=t*70;let used=0;
  for(let i=0;i<7;i++){const ln=code[(i+seed)%code.length];const n=cl(chars-used,0,ln.length)|0;used+=ln.length;
    x.fillStyle=ln.startsWith('//')||ln.startsWith('✓')?'#18b46b':[VI,INK,'#d0249f',INK,'#0090c0'][(i+seed)%5];
    x.fillText(ln.slice(0,n),-w/2+28,-h/2+60+i*36);
    if(n>0&&n<ln.length){x.fillStyle=MG;x.fillRect(-w/2+28+x.measureText(ln.slice(0,n)).width+2,-h/2+60+i*36,12,26)}}
  x.restore();
}
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function render(t){
  // camera shake on impacts
  const imp=[0,3,4.5,6,8,15,21,26.2];let sh=0;for(const i of imp){const d=t-i;if(d>=0&&d<.35)sh=Math.max(sh,(1-d/.35)*16)}
  const spd= t<3?1+t: t<21?2.5: t<26?2.5+(t-21)*2.2: 2;
  x.save();x.translate(Math.sin(t*90)*sh,Math.cos(t*77)*sh);
  bg(t,spd);
  // S1 0-3 converge + burst
  if(t<3.4){const p=seg(t,0,2.4);
    for(let i=0;i<60;i++){const an=i*2.4+t,d=(1-ease(p))*900+20;x.fillStyle=[CY1,MG,OR,VI][i%4];glow(x.fillStyle,15);x.beginPath();x.arc(CX+Math.cos(an)*d,CY+Math.sin(an)*d*.7,5,0,7);x.fill()}noGlow();
    if(t>2.2){const q=seg(t,2.2,3.4);star(t,CX,CY,back(q)*260,t*2,1-seg(t,3.0,3.4));for(let k=0;k<3;k++)ring(CX,CY,ease(q)*900*(1-k*.2),[CY1,MG,OR][k],6-k,1-q);}
    flash(1-seg(t,0,.5));}
  if(t>=2.9&&t<3.15)flash(1-seg(t,2.9,3.15));
  // S2 3-8 kinetic words
  const words=[['THINK.',3],['BUILD.',4.5],['SHIP.',6]];
  for(const[w,s]of words){const d=t-s;if(d>=0&&d<1.6){const inn=back(d/.35),out=seg(d,1.25,1.6);
      word(w,320,CY+out*-300,{sc:(2.4-1.4*inn)*(1+d*.06),a:cl(d/.15,0,1)*(1-out),sk:-.18*(1-ease(d/.4))});
      for(let k=0;k<14;k++){const an=k/14*6.28+s,r=200+ease(d/.6)*700;x.strokeStyle=[CY1,MG,OR][k%3];x.globalAlpha=1-ease(d/.8);x.lineWidth=5;x.beginPath();x.moveTo(CX+Math.cos(an)*r*.6,CY+Math.sin(an)*r*.4);x.lineTo(CX+Math.cos(an)*r,CY+Math.sin(an)*r*.66);x.stroke()}x.globalAlpha=1;}}
  if(t>7.5&&t<8.3){word('FASTER',220,CY,{sc:1+seg(t,7.5,8.3)*3,a:1-seg(t,7.9,8.3),col:OR})}
  // S3 8-15 code panels flying
  if(t>=8&&t<15.4){const d=t-8,out=seg(t,14.6,15.4);
    const pos=[[-560,-210],[0,-250],[560,-210],[-560,230],[0,190],[560,230]];
    pos.forEach(([ox,oy],i)=>{const st=i*.25,q=back((d-st)/.6);if(d<st)return;
      const fl=Math.sin(t*2+i)*14;panel(CX+ox*q*(1+out*1.5),CY+oy*q*(1+out*1.5)+fl,500,320,d-st,i*2,cl((d-st)*3,0,1)*(1-out))});
    if(d>1.5)word('WRITES ITSELF',110,CY+10,{a:seg(d,1.5,1.9)*(1-out)*(.9+.1*Math.sin(t*20)),sc:.9+back(seg(d,1.5,2))*.1+d*.01,ls:6});
  }
  // S4 15-21 parallel agents
  if(t>=15&&t<21.4){const d=t-15,inn=back(d/.8),out=seg(t,20.7,21.4);const N=8,rad=330*inn*(1+out*2);
    star(t,CX,CY,90*inn*(1-out),t*1.5,1-out);
    const nodes=[...Array(N)].map((_,i)=>{const an=i/N*6.28+t*.6;return[CX+Math.cos(an)*rad*1.45,CY+Math.sin(an)*rad*.8]});
    x.globalAlpha=1-out;
    nodes.forEach(([nx,ny],i)=>{x.strokeStyle=grad(CX,CY,nx,ny);x.lineWidth=3;x.beginPath();x.moveTo(CX,CY);x.lineTo(nx,ny);x.stroke();
      const [mx,my]=nodes[(i+1)%N];x.strokeStyle='rgba(123,92,255,.35)';x.beginPath();x.moveTo(nx,ny);x.lineTo(mx,my);x.stroke();
      const pp=(t*1.8+i*.37)%1;x.fillStyle=OR;glow(OR,20);x.beginPath();x.arc(CX+(nx-CX)*pp,CY+(ny-CY)*pp,8,0,7);x.fill();noGlow();
      const col=[CY1,MG,OR,VI][i%4];ring(nx,ny,34+Math.sin(t*6+i)*5,col,4,1-out);x.fillStyle='#fff';x.beginPath();x.arc(nx,ny,28,0,7);x.fill();
      x.fillStyle=col;x.font='800 26px Inter,Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(['</>','λ','{}','⚡','✓','#','∑','→'][i],nx,ny);
      const prog=cl((d*.35+i*.07)%1.2,0,1);x.fillStyle='rgba(20,20,40,.1)';x.fillRect(nx-40,ny+46,80,8);x.fillStyle=col;x.fillRect(nx-40,ny+46,80*prog,8);});
    x.globalAlpha=1;
    word('AGENTS IN PARALLEL',84,H-120,{a:seg(d,.6,1)*(1-out),ls:8,sc:.96+.04*ease(seg(d,.6,1.2))});
    const cnt=Math.floor(ease(seg(d,.8,5))*128);word('×'+cnt,90,130,{a:seg(d,.8,1.1)*(1-out),col:OR});
  }
  // S5 21-26 warp tunnel + kinetic stack
  if(t>=21&&t<26.4){const d=t-21;
    for(let i=0;i<10;i++){const z=((d*1.4+i/10)%1),r=40+Math.pow(z,3)*1500;x.save();x.globalAlpha=(1-z)*.9*z*3;x.strokeStyle=[CY1,MG,OR,VI][i%4];x.lineWidth=2+z*10;glow(x.strokeStyle,25);
      x.translate(CX,CY);x.rotate(z*1.2+i);x.beginPath();for(let k=0;k<=6;k++){const an=k/6*6.28;x.lineTo(Math.cos(an)*r,Math.sin(an)*r*.62)}x.stroke();x.restore()}
    const lines=[['ZERO',21.2],['FRICTION.',22.2],['INFINITE',23.4],['FLOW.',24.4]];
    for(const[w,s]of lines){const e=t-s;if(e>=0&&e<1.1){const q=back(e/.3);word(w,260,CY,{sc:.4+q*.6+e*.15,a:1-seg(e,.85,1.1),sk:(1-ease(e/.3))*.4,col:w.endsWith('.')?MG:null})}}
    if(t>25.6)flash(seg(t,25.6,26.2)*.95);
  }
  // S6 26-30 title
  if(t>=26){const d=t-26;flash(1-seg(d,.2,.7));
    star(t,CX,CY-170,back(seg(d,.1,.6))*95,t*.8,1);
    for(let k=0;k<3;k++)ring(CX,CY-170,ease(seg(d,.1,1.2))*(500+k*250),[CY1,MG,OR][k],5,1-seg(d,.1,1.2));
    const q=back(seg(d,.2,.65));
    word('CLAUDE',150,CY+20,{sc:.6+.4*q+d*.015,a:seg(d,.2,.35),ls:30*(1-ease(seg(d,.2,1)))+14,col:INK});
    word('ULTRACODE',190,CY+175,{sc:(1.8-.8*q)+d*.015,a:seg(d,.4,.55),ls:10});
    const tg='Code at the speed of thought';const n=Math.floor(seg(d,1.2,2.4)*tg.length);
    x.font='500 46px Inter,Arial';x.textAlign='center';x.fillStyle='#4a4a6a';x.letterSpacing='4px';x.fillText(tg.slice(0,n),CX,CY+320);x.letterSpacing='0px';
    x.fillStyle=grad(CX-400,0,CX+400,0);x.fillRect(CX-400*ease(seg(d,1,1.8)),CY+270,800*ease(seg(d,1,1.8)),4);
    flash(seg(t,29.4,30)*.0);
  }
  x.restore();
  // vignette scanline sheen
  const sx=((t*700)%(W+800))-400;const sg=x.createLinearGradient(sx-200,0,sx+200,0);sg.addColorStop(0,'rgba(255,255,255,0)');sg.addColorStop(.5,'rgba(255,255,255,.18)');sg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=sg;x.fillRect(0,0,W,H);
}
window.render=render;window.frame=(t)=>{render(t);return c.toDataURL('image/jpeg',.93)};
</script></body></html>
