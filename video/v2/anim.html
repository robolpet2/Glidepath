<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SG;src:url(fonts/sg500.ttf);font-weight:500}
@font-face{font-family:SG;src:url(fonts/sg700.ttf);font-weight:700}
@font-face{font-family:JB;src:url(fonts/jb500.ttf);font-weight:500}
@font-face{font-family:JB;src:url(fonts/jb700.ttf);font-weight:700}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ================= utils
const c=document.getElementById('c'),x=c.getContext('2d');
const W=1920,H=1080,CX=W/2,CY=H/2,TAU=Math.PI*2;
const COL={coral:'#D97757',neon:'#FF7A45',amber:'#FFB15E',cream:'#FBEBDD',hot:'#FF4A2B',peach:'#FFB89A',white:'#FFF4EA'};
const PAL=[COL.neon,COL.coral,COL.amber,COL.cream,COL.hot,COL.peach];
const mk=(w,h)=>{const k=document.createElement('canvas');k.width=w;k.height=h;return k};
let SEED=7;const rnd=()=>{SEED=(SEED*16807)%2147483647;return(SEED-1)/2147483646};
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const cl=(v,a,b)=>v<a?a:v>b?b:v,seg=(t,a,b)=>cl((t-a)/(b-a),0,1),lerp=(a,b,p)=>a+(b-a)*p,frac=v=>v-Math.floor(v);
const eo=t=>1-Math.pow(1-cl(t,0,1),3),ei=t=>Math.pow(cl(t,0,1),3);
const eio=t=>{t=cl(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=cl(t,0,1);const s=2.2;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const expo=t=>t>=1?1:1-Math.pow(2,-10*cl(t,0,1));
const bump=(t,c0,w)=>Math.max(0,1-Math.abs(t-c0)/w);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const rgba=(h,a)=>{const[r,g,b]=rgb(h);return`rgba(${r},${g},${b},${a})`};
const mix=(h1,h2,p)=>{const a=rgb(h1),b=rgb(h2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],p))).join(',')})`};
const rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect(a,b,w,h,r)};

// ================= assets
const SPR=PAL.map(col=>{const s=mk(64,64),k=s.getContext('2d'),g=k.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,248,238,1)');g.addColorStop(.14,rgba(col,1));g.addColorStop(.38,rgba(col,.32));g.addColorStop(1,rgba(col,0));k.fillStyle=g;k.fillRect(0,0,64,64);return s});
const N=1600,P=[];
for(let i=0;i<N;i++)P.push({r:rnd(),r2:rnd(),r3:rnd(),r4:rnd(),r5:rnd(),sw:rnd()-.5,ci:[0,0,0,1,1,2,2,3,4,5][rnd()*10|0],sz:.6+Math.pow(rnd(),3)*1.8,ph:rnd()*TAU});
const STARS=[...Array(420)].map(()=>({a:rnd()*TAU,d:.05+rnd(),z:rnd(),c:rnd()<.7?COL.cream:COL.amber}));
const NOISE=mk(256,256);{const k=NOISE.getContext('2d'),im=k.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}k.putImageData(im,0,0)}
const TMP=mk(W,H),tmx=TMP.getContext('2d'),B1=mk(W/4,H/4),b1=B1.getContext('2d'),B2=mk(W/8,H/8),b2=B2.getContext('2d');

// ================= timing
const BEAT=.375,BAR=1.5,NBLD=10,BST=[...Array(NBLD)].map((_,k)=>4.5+k*BAR),T_MOS=19.5,T_MON=22.5,T_VOR=25.5,T_TTL=27.0;
const IMP=[1.5,4.5,T_MOS,T_MON,T_TTL],WH=BST.slice(1);
const CUTS=[0,1,2,3].map(i=>T_MON+i*BEAT).concat([0,1,2,3,4,5,6,7].map(j=>T_MON+BAR+j*BEAT/2));
function spd(t){let v=.35+.6*seg(t,1.5,1.7)*(1-seg(t,25.4,25.6))+1.0*seg(t,T_MON,T_MON+.1)*(1-seg(t,25.4,25.5));for(const i of IMP)if(t>=i)v+=3.2*Math.exp(-(t-i)*3.5);for(const i of WH)v+=1.8*Math.exp(-Math.abs(t-i)*8);if(t<T_TTL)v+=4.5*ei(seg(t,T_VOR,26.95));return v}
const SPT=[0];for(let i=1;i<=32*240;i++)SPT.push(SPT[i-1]+spd((i-.5)/240)/240);
const Sx=t=>{const f=cl(t,0,31.9)*240,i=f|0;return SPT[i]+(SPT[i+1]-SPT[i])*(f-i)};
let SH=[0,0];

// ================= geometry helpers
function L(a,x1,y1,x2,y2){a.push(x1,y1,x2,y2)}
function R_(a,x0,y0,w,h){L(a,x0,y0,x0+w,y0);L(a,x0+w,y0,x0+w,y0+h);L(a,x0+w,y0+h,x0,y0+h);L(a,x0,y0+h,x0,y0)}
function PL(a,p,closed){for(let k=0;k+3<p.length;k+=2)L(a,p[k],p[k+1],p[k+2],p[k+3]);if(closed)L(a,p[p.length-2],p[p.length-1],p[0],p[1])}
function RR(a,x0,y0,w,h,r){const p=[],cs=[[x0+w-r,y0+r,-Math.PI/2],[x0+w-r,y0+h-r,0],[x0+r,y0+h-r,Math.PI/2],[x0+r,y0+r,Math.PI]];
  for(const[cx,cy,a0]of cs)for(let k=0;k<=3;k++){const an=a0+k/3*Math.PI/2;p.push(cx+Math.cos(an)*r,cy+Math.sin(an)*r)}PL(a,p,true)}
function ELL(a,cx,cy,rx,ry,n=24,a0=0,a1=TAU){const p=[];for(let k=0;k<=n;k++){const an=a0+(a1-a0)*k/n;p.push(cx+Math.cos(an)*rx,cy+Math.sin(an)*ry)}PL(a,p,false)}
const CIR=(a,cx,cy,r,n=20)=>ELL(a,cx,cy,r,r,n);
function TF(a,st,tx,ty,rot,s){const co=Math.cos(rot)*s,si=Math.sin(rot)*s;for(let k=st;k<a.length;k+=2){const px=a[k],py=a[k+1];a[k]=tx+px*co-py*si;a[k+1]=ty+px*si+py*co}}
function alongPL(p,q){let tot=0;const ls=[];for(let k=0;k+3<p.length;k+=2){const l=Math.hypot(p[k+2]-p[k],p[k+3]-p[k+1]);ls.push(l);tot+=l}let d=q*tot;for(let k=0;k<ls.length;k++){if(d<=ls[k]){const f=d/ls[k];return[lerp(p[2*k],p[2*k+2],f),lerp(p[2*k+1],p[2*k+3],f)]}d-=ls[k]}return[p[p.length-2],p[p.length-1]]}
function perim(f,w,h){const Lt=2*(w+h);let d=f*Lt;if(d<w)return[d,0];d-=w;if(d<h)return[w,d];d-=h;if(d<w)return[w-d,h];d-=w;return[0,h-d]}
function stroke3(col,w,a){x.strokeStyle=col;x.globalAlpha=a*.16;x.lineWidth=w*5;x.stroke();x.globalAlpha=a*.85;x.lineWidth=w;x.stroke();x.strokeStyle=COL.white;x.globalAlpha=a*.5;x.lineWidth=Math.max(.6,w*.35);x.stroke();x.globalAlpha=1}
function segPath(s,rev){const n=s.length/4,heads=[];for(let k=0;k<n;k++){const st=k/n*.82,f=rev>=1?1:seg(rev,st,st+.18);if(f<=0)continue;const i=k*4;x.moveTo(s[i],s[i+1]);const ex=lerp(s[i],s[i+2],f),ey=lerp(s[i+1],s[i+3],f);x.lineTo(ex,ey);if(f<1&&heads.length<80)heads.push(ex,ey)}return heads}
function backdrop(cx,cy,rx,ry,a){if(a<=0)return;x.save();x.globalCompositeOperation='source-over';x.translate(cx,cy);x.scale(rx/ry,1);const g=x.createRadialGradient(0,0,0,0,0,ry);g.addColorStop(0,`rgba(5,2,1,${.82*a})`);g.addColorStop(.6,`rgba(5,2,1,${.6*a})`);g.addColorStop(1,'rgba(5,2,1,0)');x.fillStyle=g;x.fillRect(-ry,-ry,ry*2,ry*2);x.restore()}

// ================= logo (stylised starburst)
const LR=[1,.74,.9,.68,.97,.8,.88,.7,1,.76,.93,.72],LA=LR.map((_,k)=>k*Math.PI/6+((k*7)%5-2)*.035);
function logoP(p,cx,cy,size,rot){const k=(p.r*12)|0,Lk=LR[k]*size,l=(.1+.9*p.r2)*Lk,hw=size*.085*(1-Math.pow(l/Lk,2)),off=(p.r4*2-1)*hw,an=LA[k]+rot;
  return[cx+Math.cos(an)*l-Math.sin(an)*off,cy+Math.sin(an)*l+Math.cos(an)*off]}
function drawLogo(cx,cy,size,rot,a,fillA=.25){if(a<=0||size<=0)return;x.save();x.translate(cx,cy);x.rotate(rot);x.globalCompositeOperation='lighter';x.lineJoin='round';
  for(let k=0;k<12;k++){const Lk=LR[k]*size,hw=size*.085;x.save();x.rotate(LA[k]);x.beginPath();x.moveTo(0,-hw);x.bezierCurveTo(Lk*.45,-hw,Lk*.85,-hw*.35,Lk,0);x.bezierCurveTo(Lk*.85,hw*.35,Lk*.45,hw,0,hw);x.closePath();
    x.globalAlpha=a*fillA;x.fillStyle=k%2?COL.coral:COL.neon;x.fill();x.globalAlpha=a;x.strokeStyle=COL.neon;x.lineWidth=Math.max(1.5,size*.012);x.stroke();x.restore()}
  const g=x.createRadialGradient(0,0,0,0,0,size*.25);g.addColorStop(0,rgba(COL.white,a));g.addColorStop(.4,rgba(COL.amber,a*.5));g.addColorStop(1,rgba(COL.neon,0));x.fillStyle=g;x.globalAlpha=1;x.fillRect(-size*.25,-size*.25,size*.5,size*.5);x.restore()}

// ================= kinetic text
function kword(str,px0,py,size,u,{align='center',stag=.02,dur=.22,out=0,wt=700}={}){
  if(u<=0||out>=1)return;x.save();x.font=`${wt} ${size}px SG`;x.textBaseline='middle';x.textAlign='left';
  const ch=[...str],ws=ch.map(q=>x.measureText(q).width),sp=size*.015,tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
  let px=align=='center'?px0-tot/2:align=='left'?px0:px0-tot;x.globalCompositeOperation='lighter';
  ch.forEach((q,i)=>{const p=(u-i*stag)/dur;if(p>0){const e=back(p),a=cl(p*3,0,1)*(1-out),f=ch.length>1?i/(ch.length-1):0;
    const col=f<.5?mix(COL.hot,COL.neon,f*2):mix(COL.neon,COL.amber,f*2-1);
    x.save();x.translate(px+ws[i]/2,py+(1-e)*size*.55);x.rotate((1-e)*.35);const sc=lerp(.3,1,e);x.scale(sc,sc);
    x.globalAlpha=a;x.fillStyle=col;x.fillText(q,-ws[i]/2,0);x.globalAlpha=a*.3;x.strokeStyle=COL.white;x.lineWidth=Math.max(1,size/90);x.strokeText(q,-ws[i]/2,0);x.restore()}
    px+=ws[i]+sp});x.restore()}
function fitSize(s,max,w){x.font=`700 ${max}px SG`;const m=x.measureText(s).width;return m>w?max*w/m:max}

// ================= background
function bg(t){
  x.globalCompositeOperation='source-over';x.globalAlpha=1;x.fillStyle='#070404';x.fillRect(-60,-60,W+120,H+120);
  const g=x.createRadialGradient(CX+Math.sin(t*.3)*220,CY-60,0,CX,CY,1150);g.addColorStop(0,'rgba(120,46,26,.45)');g.addColorStop(.45,'rgba(60,22,14,.25)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){const bx=W*(.5+.45*Math.sin(t*.17+i*2.1)),by=H*(.5+.4*Math.cos(t*.13+i*1.7)),br=180+i*40,gg=x.createRadialGradient(bx,by,0,bx,by,br);gg.addColorStop(0,rgba(i%2?COL.coral:COL.amber,.07));gg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gg;x.fillRect(bx-br,by-br,br*2,br*2)}
  const S=Sx(t),hz=770;x.lineWidth=1.5;
  for(let k=0;k<16;k++){const z=frac(k/16+S*.35),y=hz+Math.pow(z,2.4)*360;x.strokeStyle=rgba(COL.coral,.04+z*.28);x.beginPath();x.moveTo(-60,y);x.lineTo(W+60,y);x.stroke()}
  x.strokeStyle=rgba(COL.coral,.13);x.beginPath();for(let k=-24;k<=24;k++){x.moveTo(CX+k*30,hz);x.lineTo(CX+k*270,hz+380)}x.stroke();
  const hg=x.createLinearGradient(0,hz-40,0,hz+40);hg.addColorStop(0,'rgba(0,0,0,0)');hg.addColorStop(.5,rgba(COL.neon,.2));hg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=hg;x.fillRect(-60,hz-40,W+120,80);
  const sp=spd(t);
  for(const s of STARS){const z=frac(s.z+S*.12*(.5+s.d)),z2=Math.max(0,z-.01*sp),k=1/(1.08-z)-.9,k2=1/(1.08-z2)-.9,r1=s.d*90*k,r2=s.d*90*k2,ca=Math.cos(s.a),sa=Math.sin(s.a);
    x.strokeStyle=s.c;x.globalAlpha=cl(z*1.4,0,1)*.65;x.lineWidth=.6+z*2;x.beginPath();x.moveTo(CX+ca*r2*1.6,CY+sa*r2);x.lineTo(CX+ca*r1*1.6+.5,CY+sa*r1);x.stroke()}
  x.globalAlpha=1}

// ================= scene 1: dust / logo
function dustPts(t){const o=new Float32Array(2*N);for(let i=0;i<N;i++){const p=P[i],z=.3+p.r3*.7,a=p.r*TAU+t*.08*(p.r4-.5),rad=(.15+p.r2)*900;o[2*i]=CX+Math.cos(a)*rad*.78/z;o[2*i+1]=CY+Math.sin(a)*rad*.48/z}return o}
function logoPts(t){const o=new Float32Array(2*N),s=240*(1+.03*Math.sin(t*4));for(let i=0;i<N;i++){const q=logoP(P[i],CX,CY-40,s,t*.3);o[2*i]=q[0];o[2*i+1]=q[1]}return o}

// ================= scene 2: hive of agents
function hivePts(t){const o=new Float32Array(2*N),yaw=Math.sin(t*.5)*.14,cy=Math.cos(yaw),sy=Math.sin(yaw),hz=440-seg(t,1.5,3.0)*30;
  for(let i=0;i<N;i++){const col=i%50,row=(i/50)|0,X=(col-24.5)*72,dz=(31-row)*68+420-1500,X2=X*cy-dz*sy,Z2=1500+X*sy+dz*cy,wave=Math.sin(col*.35+t*3)*Math.cos(row*.28+t*2.2)*28;
    o[2*i]=CX+X2*820/Z2;o[2*i+1]=hz+(250+wave)*820/Z2}return o}
const TAGS=['refactor /api','write tests','migrate db','polish ui','perf audit','fix #4127','write docs','deploy edge'];
function hiveFx(t,pos,a){if(a<=0)return;x.globalCompositeOperation='lighter';
  x.beginPath();for(let j=0;j<170;j++){const i=(hash(j*3.7+Math.floor(t*4+j*.1)*.917)*N)|0,nb=hash(j*1.1)>.5?i+1:i+50;if(nb>=N||(nb==i+1&&i%50==49))continue;x.moveTo(pos[2*i],pos[2*i+1]);x.lineTo(pos[2*nb],pos[2*nb+1])}
  x.strokeStyle=COL.neon;x.globalAlpha=.5*a;x.lineWidth=1.4;x.stroke();
  for(let j=0;j<30;j++){const ph=frac(t*1.6+j*.383),i=(hash(j*9.1+Math.floor(t*1.6+j*.383)*1.37)*N)|0;x.strokeStyle=j%3?COL.neon:COL.amber;x.globalAlpha=(1-ph)*a;x.lineWidth=2;x.beginPath();x.arc(pos[2*i],pos[2*i+1],4+ph*36,0,TAU);x.stroke()}
  for(let j=0;j<8;j++){const i=1250+((j*5+3)%8)*41+(j%2)*50+4,px=pos[2*i],py=pos[2*i+1],ta=a*seg(t,1.85+j*.05,1.98+j*.05);if(ta<=0)continue;
    const lab=`agent-${String(300+i).padStart(4,'0')} ▸ ${TAGS[j]}`;x.font='700 15px JB';const tw=x.measureText(lab).width;
    x.globalAlpha=ta;x.globalCompositeOperation='source-over';x.fillStyle='rgba(18,8,5,.85)';rr(px+28,py-62,tw+20,28,14);x.fill();
    x.globalCompositeOperation='lighter';x.strokeStyle=COL.neon;x.lineWidth=1.5;x.stroke();x.beginPath();x.moveTo(px,py);x.lineTo(px+28,py-48);x.stroke();
    x.fillStyle=COL.cream;x.textAlign='left';x.textBaseline='middle';x.fillText(lab,px+38,py-48)}
  x.globalAlpha=1}

// ================= scene 3: agent wall
const TASKS=['writing auth service','migrating schema','generating tests','refactoring api/','optimizing queries','building ui kit','fixing flaky test','reviewing PR #812','deploying edge fn','indexing docs','profiling hot path','writing e2e suite','scaffolding ios app','tuning shaders','updating deps','designing schema','load testing','i18n strings'];
function wallProj(t,X,Y){const camX=-150+(t-2.9)*650,Zb=1150-ei(seg(t,4.15,4.62))*1110,wx=X-camX,Z2=Zb+wx*.37;if(Z2<40)return null;return[CX-200+wx*.93*900/Z2,CY+Y*900/Z2,Z2]}
function drawWall(t){if(t<2.9||t>4.65)return;const al=seg(t,2.92,3.15)*(1-seg(t,4.42,4.62)),w=270,h=164;
  for(let col=-4;col<14;col++)for(let row=0;row<6;row++){const X=col*300,Y=(row-2.5)*190,A=wallProj(t,X-135,Y-82),B=wallProj(t,X+135,Y-82),C=wallProj(t,X-135,Y+82);if(!A||!B||!C)continue;
    if(Math.max(A[0],B[0])<-60||Math.min(A[0],B[0])>W+60)continue;
    const id=(col+4)*6+row,hs=hash(id*3.1),v=frac(hs+t*.9),done=v>.78,dep=A[2],fa=al*cl((3400-dep)/1400,0,1)*cl((dep-60)/220,0,1);if(fa<=.01)continue;
    x.setTransform((B[0]-A[0])/w,(B[1]-A[1])/w,(C[0]-A[0])/h,(C[1]-A[1])/h,A[0]+SH[0],A[1]+SH[1]);
    x.globalAlpha=fa;x.globalCompositeOperation='source-over';x.fillStyle='rgba(22,10,6,.9)';rr(0,0,w,h,14);x.fill();
    x.globalCompositeOperation='lighter';x.strokeStyle=done?COL.amber:COL.neon;x.lineWidth=2.5;x.globalAlpha=fa*(.6+.4*Math.sin(t*6+id));x.stroke();x.globalAlpha=fa;
    x.fillStyle=done?COL.amber:COL.neon;x.beginPath();x.arc(18,20,5,0,TAU);x.fill();
    x.font='700 15px JB';x.textAlign='left';x.textBaseline='middle';x.fillStyle=COL.cream;x.fillText('agent-'+String(100+id*7).padStart(4,'0'),32,20);
    x.textAlign='right';x.font='700 12px JB';x.fillStyle=done?COL.amber:COL.peach;x.fillText(done?'DONE ✓':'RUNNING',w-14,20);
    x.textAlign='left';x.font='500 13px JB';x.fillStyle=COL.peach;x.fillText('▸ '+TASKS[id%TASKS.length],14,46);
    const sc=t*90+id*17;for(let l=0;l<6;l++){const li=Math.floor(sc/16)+l,yy=64+l*16-(sc%16);if(yy<60||yy>132)continue;x.fillStyle=l%2?rgba(COL.coral,.55):rgba(COL.amber,.45);x.fillRect(14+(hash(li+id*2)*3|0)*12,yy,40+hash(li*1.3+id)*170,7)}
    x.fillStyle='rgba(255,255,255,.08)';x.fillRect(14,h-18,w-28,5);x.fillStyle=done?COL.amber:COL.neon;x.fillRect(14,h-18,(w-28)*(done?1:v/.78),5)}
  x.setTransform(1,0,0,1,SH[0],SH[1]);x.globalAlpha=1}
function wallPts(t){const o=new Float32Array(2*N);for(let i=0;i<N;i++){const p=P[i];let X,Y;
    if(p.r3<.55){const a=(p.r*40)|0,b=(p.r4*40)|0,ph=frac(p.r2+t*1.6),e=eio(ph);X=lerp((a%10)*300,(b%10)*300,e);Y=lerp(((a/10|0)-1.5)*190,((b/10|0)-1.5)*190,e)-Math.sin(ph*Math.PI)*120}
    else{const cc=(p.r*60)|0,[ox,oy]=perim(frac(p.r2+t*.25*(p.r4>.5?1:-1)),270,164);X=(cc%10)*300-135+ox;Y=((cc/10|0)-2.5)*190-82+oy}
    const q=wallProj(t,X,Y);if(q){o[2*i]=q[0];o[2*i+1]=q[1]}else{o[2*i]=CX+(p.r-.5)*3000;o[2*i+1]=CY+(p.r2-.5)*2000}}return o}

// ================= builds
function geoWeb(u,t){const a=[];
  RR(a,-450,-290,900,580,20);L(a,-450,-238,450,-238);for(let i=0;i<3;i++)CIR(a,-418+i*24,-264,7,10);RR(a,-250,-277,500,26,13);

    if(p.r3<.22)[px,py]=logoP(p,CX,CY-215,100,t*.3);else{px=TP[2*i]+Math.sin(t*3+p.ph)*1.5;py=TP[2*i+1]+Math.cos(t*2.6+p.ph)*1.5}
    o[2*i]=CX+(px-CX)*ts;o[2*i+1]=CY+(py-CY)*ts}return o}
function flick(d){if(d<0)return 0;const pat=[0,1,0,0,1,.3,1,0,1,1];const i=Math.floor(d/.045);return i<pat.length?pat[i]:1}
function neonWord(str,x0,y0,size,ls,fill,a,grad){x.font=`700 ${size}px SG`;x.letterSpacing=ls+'px';x.textAlign='center';x.textBaseline='middle';x.globalCompositeOperation='lighter';
  x.globalAlpha=a*.5;x.shadowColor=COL.hot;x.shadowBlur=50;x.strokeStyle=COL.neon;x.lineWidth=size/16;x.strokeText(str,x0,y0);x.shadowBlur=0;
  x.globalCompositeOperation='source-over';x.globalAlpha=a;if(grad){const g=x.createLinearGradient(x0-650,0,x0+650,0);g.addColorStop(0,COL.hot);g.addColorStop(.5,COL.neon);g.addColorStop(1,COL.amber);x.fillStyle=g}else x.fillStyle=fill;x.fillText(str,x0,y0);
  x.globalCompositeOperation='lighter';x.strokeStyle=grad?COL.peach:COL.white;x.lineWidth=Math.max(1.5,size/90);x.globalAlpha=a*.35;x.strokeText(str,x0,y0);x.letterSpacing='0px';x.globalAlpha=1}
function drawTitle(t){if(t<T_TTL)return;const d=t-T_TTL,ts=tScale(t);x.save();x.translate(CX,CY);x.scale(ts,ts);x.translate(-CX,-CY);x.globalCompositeOperation='lighter';
  for(let k=0;k<3;k++){const q=seg(d,k*.08,1.0+k*.08);if(q>0&&q<1){x.strokeStyle=[COL.neon,COL.amber,COL.cream][k];x.globalAlpha=(1-q)*.9;x.lineWidth=10*(1-q)+1;x.beginPath();x.ellipse(CX,CY,eo(q)*1400,eo(q)*820,0,0,TAU);x.stroke()}}
  for(let k=0;k<16;k++){const q=seg(d,0,.5);if(q<1){const an=k/16*TAU,r1=eo(q)*1500,r0=r1*.6;x.strokeStyle=k%2?COL.amber:COL.neon;x.globalAlpha=1-q;x.lineWidth=4;x.beginPath();x.moveTo(CX+Math.cos(an)*r0,CY+Math.sin(an)*r0*.6);x.lineTo(CX+Math.cos(an)*r1,CY+Math.sin(an)*r1*.6);x.stroke()}}
  x.globalAlpha=1;const lq=seg(d,.2,.6);drawLogo(CX,CY-215,100*back(lq),t*.3,lq,.35);
  const fl=flick(d-.3);if(fl>0){neonWord('CLAUDE',CX+19,CY+5,120,38,COL.cream,fl,false);neonWord('ULTRACODE',CX+5,CY+150,200,10,null,fl,true);
    const sw=seg(d,.95,1.9);if(sw>0&&sw<1){const bx=CX-900+sw*1800,g=x.createLinearGradient(bx-160,0,bx+160,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,245,235,.85)');g.addColorStop(1,'rgba(255,255,255,0)');x.font='700 200px SG';x.letterSpacing='10px';x.textAlign='center';x.fillStyle=g;x.globalCompositeOperation='lighter';x.fillText('ULTRACODE',CX+5,CY+150);x.letterSpacing='0px'}}
  const uq=eo(seg(d,.6,1.0));if(uq>0){const g=x.createLinearGradient(CX-460,0,CX+460,0);g.addColorStop(0,rgba(COL.hot,0));g.addColorStop(.5,COL.neon);g.addColorStop(1,rgba(COL.amber,0));x.fillStyle=g;x.globalAlpha=1;x.fillRect(CX-460*uq,CY+250,920*uq,3)}
  const tg='Code at the speed of thought',n=Math.floor(seg(d,.75,1.4)*tg.length);x.font='500 44px SG';x.letterSpacing='5px';x.textAlign='left';x.textBaseline='middle';const fw=x.measureText(tg).width;x.fillStyle=COL.cream;x.globalAlpha=1;x.fillText(tg.slice(0,n),CX-fw/2,CY+305);
  if(d>.7&&(n<tg.length||Math.floor(t*3)%2==0)){x.fillStyle=COL.neon;x.fillRect(CX-fw/2+x.measureText(tg.slice(0,n)).width+4,CY+283,4,44)}x.letterSpacing='0px';x.restore()}

// ---- particles
const KF=[{t0:-9,dur:.1,st:0,sw:0,fn:dustPts},{t0:.05,dur:.6,st:.3,sw:.8,fn:logoPts},{t0:1.5,dur:.45,st:.2,sw:1.7,fn:hivePts},{t0:2.95,dur:.38,st:.18,sw:.6,fn:wallPts},
  ...BST.map((b,k)=>({t0:b-.12,dur:k?.3:.4,st:.12,sw:.5,fn:t=>buildPts(k,t)})),
  {t0:T_MOS-.1,dur:.4,st:.15,sw:.5,fn:mosaicPts},
  ...CUTS.map((cs,c)=>({t0:cs-.02,dur:c<4?.2:.11,st:c<4?.08:.04,sw:.3,fn:montagePts(c)})),
  {t0:T_VOR,dur:.45,st:.15,sw:0,fn:vortexPts},{t0:T_TTL,dur:.6,st:.25,sw:1.3,fn:titlePts}];
function particles(t){const o=new Float32Array(2*N);let k=0;while(k+1<KF.length&&KF[k+1].t0<=t)k++;const B=KF[k],A=k>0?KF[k-1]:null,PB=B.fn(t),tr=A&&t<B.t0+B.dur+B.st,PA=tr?A.fn(t):null;
  for(let i=0;i<N;i++){const p=P[i];let bx=PB[2*i],by=PB[2*i+1];
    if(tr){const q=eio((t-B.t0-p.r5*B.st)/B.dur);if(q<1){const ax=PA[2*i],ay=PA[2*i+1],dx=bx-ax,dy=by-ay,sw=Math.sin(q*Math.PI)*p.sw*B.sw;bx=ax+dx*q-dy*sw;by=ay+dy*q+dx*sw}}
    o[2*i]=bx+Math.sin(t*2.3+p.ph)*2;o[2*i+1]=by+Math.cos(t*1.9+p.ph)*2}return o}
function drawParticles(pos,prev,t){const pa=(1-.6*seg(t,T_TTL+.6,T_TTL+1.2))*seg(t,0,.25);x.globalCompositeOperation='lighter';
  for(let c0=0;c0<6;c0++){x.beginPath();for(let i=0;i<N;i++){if(P[i].ci!==c0)continue;const dx=pos[2*i]-prev[2*i],dy=pos[2*i+1]-prev[2*i+1],d2=dx*dx+dy*dy;if(d2>9&&d2<202500){x.moveTo(prev[2*i],prev[2*i+1]);x.lineTo(pos[2*i],pos[2*i+1])}}x.strokeStyle=PAL[c0];x.lineWidth=1.8;x.globalAlpha=.55*pa;x.stroke()}
  for(let i=0;i<N;i++){const p=P[i],s=10*p.sz*(.7+.3*Math.sin(t*6+p.ph*3));x.globalAlpha=pa;x.drawImage(SPR[p.ci],pos[2*i]-s/2,pos[2*i+1]-s/2,s,s)}x.globalAlpha=1}

// ---- scene + overlay
function scene(t,pos){x.setTransform(1,0,0,1,SH[0],SH[1]);
  if(t<1.7){x.globalCompositeOperation='lighter';const ig=seg(t,0,.5)*(1-seg(t,1.45,1.55)),gr=70+ig*90+Math.sin(t*14)*8,g=x.createRadialGradient(CX,CY-40,0,CX,CY-40,gr);g.addColorStop(0,rgba(COL.white,.9*ig));g.addColorStop(.3,rgba(COL.neon,.5*ig));g.addColorStop(1,rgba(COL.neon,0));x.fillStyle=g;x.fillRect(CX-gr,CY-40-gr,gr*2,gr*2);
    const lq=seg(t,.35,1.05);drawLogo(CX,CY-40,240*(.9+.1*back(lq))*(1+.03*Math.sin(t*6)),t*.5,lq*(1-seg(t,1.45,1.56)),.22);
    const rq=seg(t,.85,1.5);if(rq>0&&rq<1){x.strokeStyle=COL.amber;x.globalAlpha=rq;x.lineWidth=3+rq*5;x.beginPath();x.ellipse(CX,CY-40,lerp(900,40,ei(rq)),lerp(600,30,ei(rq)),0,0,TAU);x.stroke();x.globalAlpha=1}}
  if(t>=1.5&&t<2.4){x.globalCompositeOperation='lighter';const q=seg(t,1.5,2.3);for(let k=0;k<4;k++){const qq=seg(q,k*.08,1);x.strokeStyle=[COL.cream,COL.neon,COL.amber,COL.hot][k];x.globalAlpha=1-qq;x.lineWidth=12*(1-qq)+1;x.beginPath();x.ellipse(CX,CY-40,eo(qq)*1500,eo(qq)*900,0,0,TAU);x.stroke()}
    for(let k=0;k<24;k++){const an=k/24*TAU+.1,r1=eo(q)*1800,r0=r1*.55;x.strokeStyle=k%2?COL.amber:COL.neon;x.globalAlpha=1-q;x.lineWidth=5;x.beginPath();x.moveTo(CX+Math.cos(an)*r0,CY-40+Math.sin(an)*r0*.6);x.lineTo(CX+Math.cos(an)*r1,CY-40+Math.sin(an)*r1*.6);x.stroke()}x.globalAlpha=1}
  if(t>=1.5&&t<3.2)hiveFx(t,pos,seg(t,1.75,2.0)*(1-seg(t,2.85,3.05)));
  drawWall(t);
  for(let k=0;k<NBLD;k++){const u=t-BST[k];if(u>=-.1&&u<BAR)drawBuild(k,t)}
  drawMosaic(t);drawMontage(t);drawVortex(t)}
function hud(t){const a=seg(t,1.8,2.1)*(1-seg(t,25.3,25.6));if(a<=0)return;x.globalCompositeOperation='lighter';x.globalAlpha=a*.95;x.textBaseline='middle';
  x.textAlign='left';x.font='700 19px JB';x.fillStyle=COL.neon;x.fillText('✱ ULTRACODE',60,56);x.font='500 15px JB';x.fillStyle=COL.peach;x.fillText('swarm view · live',60,82);
  const ag=Math.round(1024*expo(seg(t,2.25,2.7))),tk=Math.round(48912*Math.pow(seg(t,2.25,25.5),1.3)),s=`AGENTS ${fmt(ag)}   TASKS ${fmt(tk)}`;x.textAlign='right';x.font='700 19px JB';x.fillStyle=COL.cream;x.fillText(s,W-60,56);
  const sw=x.measureText(s).width;x.fillStyle=COL.neon;x.globalAlpha=a*(.5+.5*Math.sin(t*12));x.beginPath();x.arc(W-60-sw-16,56,6,0,TAU);x.fill();x.globalAlpha=a*.8;
  x.font='500 15px JB';x.fillStyle=COL.peach;x.fillText('throughput '+fmt(1800+Math.sin(t*5)*120+t*90)+' ops/s',W-60,82);
  x.strokeStyle=COL.coral;x.lineWidth=2;x.globalAlpha=a*.7;x.beginPath();for(const[sx,sy]of[[30,30],[W-30,30],[W-30,H-30],[30,H-30]]){const dx=sx<CX?1:-1,dy=sy<CY?1:-1;x.moveTo(sx+dx*40,sy);x.lineTo(sx,sy);x.lineTo(sx,sy+dy*40)}x.stroke();
  x.globalAlpha=a*.85;x.textAlign='left';x.font='500 15px JB';x.fillStyle=COL.peach;x.fillText('T+'+t.toFixed(2)+'s',60,H-56);
  const pw=300,pp=seg(t,1.5,25.5);x.fillStyle='rgba(255,160,120,.15)';x.fillRect(W-60-pw,H-60,pw,4);x.fillStyle=COL.neon;x.fillRect(W-60-pw,H-60,pw*pp,4);x.globalAlpha=1}
function overlay(t){x.setTransform(1,0,0,1,SH[0],SH[1]);
  if(t<1.5){const a=seg(t,.02,.12)*(1-seg(t,1.25,1.45)),s='› build me everything',n=Math.floor(seg(t,.05,.5)*s.length);x.font='500 36px JB';const fw=x.measureText(s).width;x.textAlign='left';x.textBaseline='middle';x.globalCompositeOperation='lighter';x.globalAlpha=a;x.fillStyle=COL.cream;x.fillText(s.slice(0,n),CX-fw/2,CY+300);
    if(n<s.length||Math.floor(t*6)%2==0){x.fillStyle=COL.neon;x.fillRect(CX-fw/2+x.measureText(s.slice(0,n)).width+6,CY+282,18,36)}x.globalAlpha=1}
  if(t>=1.5&&t<2.3){const out=seg(t,2.15,2.3);x.save();x.translate(0,-out*120);kword('1 PROMPT',CX,200,140,t-1.52,{out});x.restore()}
  if(t>=2.25&&t<3.0){const out=seg(t,2.86,3.0),n=Math.round(1024*expo(seg(t,2.25,2.7)));x.save();x.translate(CX,200);x.scale(1+out*.6,1+out*.6);x.translate(-CX,-200);kword(fmt(n)+' AGENTS',CX,200,140,t-2.25,{out});x.restore()}
  for(const[w,s,e,sz]of[['SPAWN.',3.0,3.36,210],['PLAN.',3.375,3.735,210],['PARALLELIZE.',3.75,4.4,175]])if(t>=s&&t<e){const out=seg(t,e-.1,e),sc=1+out*.5+(t-s)*.12;backdrop(CX,CY,1000,280,(1-out)*seg(t,s,s+.06));x.save();x.translate(CX,CY);x.scale(sc,sc);x.translate(-CX,-CY);kword(w,CX,CY,sz,t-s,{out,stag:.015,dur:.16});x.restore()}
  for(let k=0;k<NBLD;k++)drawLabel(k,t);
  if(t>=T_MOS+.1&&t<20.98){const out=seg(t,20.85,20.98);backdrop(CX,CY,1050,360,(1-out)*seg(t,T_MOS+.1,T_MOS+.2));kword('BUILD',CX,CY-85,150,t-T_MOS-.1,{out,stag:.02,dur:.2});kword('EVERYTHING.',CX,CY+70,175,t-T_MOS-.25,{out,stag:.015,dur:.2})}
  if(t>=21.0&&t<T_MON){const out=seg(t,22.35,22.48),sc=1+(t-21)*.06+out*.8;backdrop(CX,CY,1100,300,(1-out)*seg(t,21,21.08));x.save();x.translate(CX,CY);x.scale(sc,sc);x.translate(-CX,-CY);kword('ALL AT ONCE.',CX,CY,210,t-21.0,{out,stag:.018,dur:.2});x.restore()}
  if(t>=19.8&&t<T_MON){const a=seg(t,19.8,20)*(1-seg(t,22.3,22.45)),s=`▸ ${fmt(1024)} agents online   ·   ${fmt(Math.round(lerp(36200,46900,seg(t,19.8,22.5))))} tasks shipped   ·   0 blockers`;x.font='700 22px JB';const tw=x.measureText(s).width;
    x.globalCompositeOperation='source-over';x.globalAlpha=a;x.fillStyle='rgba(14,6,4,.9)';rr(CX-tw/2-30,H-140,tw+60,52,26);x.fill();x.globalCompositeOperation='lighter';x.strokeStyle=COL.neon;x.lineWidth=2;x.stroke();x.fillStyle=COL.cream;x.textAlign='center';x.textBaseline='middle';x.fillText(s,CX,H-113);x.globalAlpha=1}
  if(t>=T_MON&&t<T_VOR){const c=cutIdx(t),w=t-CUTS[c];if(c<4){backdrop(CX,CY,950,260,1);kword(MW1[c],CX,CY,230,w+.02,{stag:.015,dur:.14})}
    else{backdrop(CX,CY,700,300,1);const sc=1+w*.8;x.save();x.translate(CX,CY);x.scale(sc,sc);x.translate(-CX,-CY);kword(MW2[c-4],CX,CY+20,270,w+.06,{stag:.01,dur:.08});x.restore();
      x.globalCompositeOperation='lighter';x.font='700 30px JB';x.letterSpacing='12px';x.textAlign='center';x.fillStyle=COL.amber;x.globalAlpha=1;x.fillText('SPEED',CX+6,CY-200);x.letterSpacing='0px'}}
  hud(t);drawTitle(t)}
function fx(t){x.setTransform(1,0,0,1,0,0);
  let zb=0;for(const i of IMP)zb=Math.max(zb,bump(t,i+.04,.2));for(let k=1;k<NBLD;k++)if(TR[k]=='zoom'||TR[k]=='spin')zb=Math.max(zb,bump(t,BST[k],.16));for(const cs of CUTS)zb=Math.max(zb,.55*bump(t,cs+.02,.08));if(t<T_TTL)zb=Math.max(zb,seg(t,T_VOR,26.95)*1.2);zb=Math.max(zb,bump(t,T_TTL+.05,.3));
  if(zb>.02){tmx.globalCompositeOperation='copy';tmx.drawImage(c,0,0);x.globalCompositeOperation='lighter';for(let k=1;k<=4;k++){const s=1+zb*k*.035;x.globalAlpha=.15*zb;x.drawImage(TMP,CX-CX*s,CY-CY*s,W*s,H*s)}}
  let wx=0,wy=0;for(let k=1;k<NBLD;k++){if(TR[k]=='whipx')wx=Math.max(wx,bump(t,BST[k],.17));if(TR[k]=='whipy')wy=Math.max(wy,bump(t,BST[k],.17))}
  if(wx>.02||wy>.02){tmx.globalCompositeOperation='copy';tmx.drawImage(c,0,0);x.globalCompositeOperation='source-over';for(let k=1;k<=5;k++){x.globalAlpha=.2;x.drawImage(TMP,k*60*wx,k*60*wy)}
    x.globalCompositeOperation='lighter';const fr=Math.floor(t*30);for(let k=0;k<26;k++){const q=hash(k*7.7+fr),len=300+q*900;x.strokeStyle=k%2?COL.amber:COL.neon;x.globalAlpha=Math.max(wx,wy)*.7;x.lineWidth=1+q*3;x.beginPath();if(wx>wy){const y=hash(k*3.3+fr*.7)*H,x0=hash(k*1.9+fr)*W;x.moveTo(x0,y);x.lineTo(x0+len,y)}else{const xx=hash(k*3.3+fr*.7)*W,y0=hash(k*1.9+fr)*H;x.moveTo(xx,y0);x.lineTo(xx,y0+len)}x.stroke()}}
  x.globalAlpha=1}
function bloom(){x.setTransform(1,0,0,1,0,0);b1.globalCompositeOperation='copy';b1.filter='contrast(1.6) blur(2px)';b1.drawImage(c,0,0,W/4,H/4);b2.globalCompositeOperation='copy';b2.filter='blur(3px)';b2.drawImage(B1,0,0,W/8,H/8);b1.filter='none';b2.filter='none';
  x.globalCompositeOperation='lighter';x.globalAlpha=.45;x.drawImage(B1,0,0,W,H);x.globalAlpha=.65;x.drawImage(B2,0,0,W,H);x.globalAlpha=1}
const FLASH=[[1.5,.45,.22],[4.5,.3,.2],[T_MOS,.25,.2],[T_MON,.3,.16],[T_TTL,.55,.35],...CUTS.slice(1).map(cs=>[cs,.14,.06])];
function grade(t){x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';const v=x.createRadialGradient(CX,CY,H*.35,CX,CY,H*1.05);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.72)');x.fillStyle=v;x.fillRect(0,0,W,H);
  const fr=Math.floor(t*30),ox=(hash(fr)*256)|0,oy=(hash(fr+.5)*256)|0;x.globalAlpha=.05;x.globalCompositeOperation='lighter';x.translate(-ox,-oy);x.fillStyle=x.createPattern(NOISE,'repeat');x.fillRect(ox,oy,W,H);x.setTransform(1,0,0,1,0,0);
  x.globalCompositeOperation='source-over';let f=0;for(const[i,s,d]of FLASH)if(t>=i&&t<i+d)f=Math.max(f,s*(1-(t-i)/d));
  if(f>0){x.globalAlpha=f;x.fillStyle='#FFE9DA';x.fillRect(0,0,W,H)}
  const bk=Math.max(1-seg(t,0,.15),seg(t,29.72,30));if(bk>0){x.globalAlpha=bk;x.fillStyle='#000';x.fillRect(0,0,W,H)}x.globalAlpha=1}
function render(t){CACHE.clear();let sh=0;for(const i of IMP){const d=t-i;if(d>=0&&d<.4)sh=Math.max(sh,(1-d/.4)*(i==T_TTL?22:16))}for(const i of WH){const d=t-i;if(d>=0&&d<.2)sh=Math.max(sh,(1-d/.2)*8)}for(const i of CUTS){const d=t-i;if(d>=0&&d<.12)sh=Math.max(sh,(1-d/.12)*6)}
  SH=[Math.sin(t*93)*sh,Math.cos(t*71)*sh];const pos=particles(t),prev=particles(t-.03);
  x.setTransform(1,0,0,1,SH[0],SH[1]);x.globalAlpha=1;bg(t);scene(t,pos);x.setTransform(1,0,0,1,SH[0],SH[1]);drawParticles(pos,prev,t);overlay(t);fx(t);bloom();grade(t)}
window.render=render;window.frame=t=>{render(t);return c.toDataURL('image/jpeg',.94)};
window.ready=async()=>{await Promise.all(['500 20px SG','700 20px SG','500 20px JB','700 20px JB'].map(f=>document.fonts.load(f)));initTitle();return true};
</script></body></html>
