<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:SG;src:url(fonts/sg500.ttf);font-weight:500}
@font-face{font-family:SG;src:url(fonts/sg700.ttf);font-weight:700}
@font-face{font-family:JB;src:url(fonts/jb500.ttf);font-weight:500}
@font-face{font-family:JB;src:url(fonts/jb700.ttf);font-weight:700}
html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ================= utils
const c=document.getElementById('c'),x=c.getContext('2d');
const W=1920,H=1080,CX=W/2,CY=H/2,TAU=Math.PI*2;
const COL={coral:'#D97757',neon:'#FF7A45',amber:'#FFB15E',cream:'#FBEBDD',hot:'#FF4A2B',peach:'#FFB89A',white:'#FFF4EA'};
const PAL=[COL.neon,COL.coral,COL.amber,COL.cream,COL.hot,COL.peach];
const mk=(w,h)=>{const k=document.createElement('canvas');k.width=w;k.height=h;return k};
let SEED=7;const rnd=()=>{SEED=(SEED*16807)%2147483647;return(SEED-1)/2147483646};
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const cl=(v,a,b)=>v<a?a:v>b?b:v,seg=(t,a,b)=>cl((t-a)/(b-a),0,1),lerp=(a,b,p)=>a+(b-a)*p,frac=v=>v-Math.floor(v);
const eo=t=>1-Math.pow(1-cl(t,0,1),3),ei=t=>Math.pow(cl(t,0,1),3);
const eio=t=>{t=cl(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=cl(t,0,1);const s=2.2;return 1+(s+1)*Math.pow(t-1,3)+s*Math.pow(t-1,2)};
const expo=t=>t>=1?1:1-Math.pow(2,-10*cl(t,0,1));
const bump=(t,c0,w)=>Math.max(0,1-Math.abs(t-c0)/w);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const rgba=(h,a)=>{const[r,g,b]=rgb(h);return`rgba(${r},${g},${b},${a})`};
const mix=(h1,h2,p)=>{const a=rgb(h1),b=rgb(h2);return`rgb(${a.map((v,i)=>Math.round(lerp(v,b[i],p))).join(',')})`};
const rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect(a,b,w,h,r)};

// ================= assets
const SPR=PAL.map(col=>{const s=mk(64,64),k=s.getContext('2d'),g=k.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,248,238,1)');g.addColorStop(.14,rgba(col,1));g.addColorStop(.38,rgba(col,.32));g.addColorStop(1,rgba(col,0));k.fillStyle=g;k.fillRect(0,0,64,64);return s});
const N=1600,P=[];
for(let i=0;i<N;i++)P.push({r:rnd(),r2:rnd(),r3:rnd(),r4:rnd(),r5:rnd(),sw:rnd()-.5,ci:[0,0,0,1,1,2,2,3,4,5][rnd()*10|0],sz:.6+Math.pow(rnd(),3)*1.8,ph:rnd()*TAU});
const STARS=[...Array(420)].map(()=>({a:rnd()*TAU,d:.05+rnd(),z:rnd(),c:rnd()<.7?COL.cream:COL.amber}));
const NOISE=mk(256,256);{const k=NOISE.getContext('2d'),im=k.createImageData(256,256);for(let i=0;i<im.data.length;i+=4){const v=rnd()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}k.putImageData(im,0,0)}
const TMP=mk(W,H),tmx=TMP.getContext('2d'),B1=mk(W/4,H/4),b1=B1.getContext('2d'),B2=mk(W/8,H/8),b2=B2.getContext('2d');

// ================= timing
const IMP=[3,9,21,26.5],WH=[11,13,15,17,19],BST=[9,11,13,15,17,19];
function spd(t){let v=.35+.55*seg(t,3,3.2)*(1-seg(t,25.2,25.4));for(const i of IMP)if(t>=i)v+=3.2*Math.exp(-(t-i)*2.8);for(const i of WH)v+=1.6*Math.exp(-Math.abs(t-i)*5);if(t<26.5)v+=4*ei(seg(t,25.3,26.4));return v}
const SPT=[0];for(let i=1;i<=32*240;i++)SPT.push(SPT[i-1]+spd((i-.5)/240)/240);
const Sx=t=>{const f=cl(t,0,31.9)*240,i=f|0;return SPT[i]+(SPT[i+1]-SPT[i])*(f-i)};
let SH=[0,0];

// ================= geometry helpers
function L(a,x1,y1,x2,y2){a.push(x1,y1,x2,y2)}
function R_(a,x0,y0,w,h){L(a,x0,y0,x0+w,y0);L(a,x0+w,y0,x0+w,y0+h);L(a,x0+w,y0+h,x0,y0+h);L(a,x0,y0+h,x0,y0)}
function PL(a,p,closed){for(let k=0;k+3<p.length;k+=2)L(a,p[k],p[k+1],p[k+2],p[k+3]);if(closed)L(a,p[p.length-2],p[p.length-1],p[0],p[1])}
function RR(a,x0,y0,w,h,r){const p=[],cs=[[x0+w-r,y0+r,-Math.PI/2],[x0+w-r,y0+h-r,0],[x0+r,y0+h-r,Math.PI/2],[x0+r,y0+r,Math.PI]];
  for(const[cx,cy,a0]of cs)for(let k=0;k<=3;k++){const an=a0+k/3*Math.PI/2;p.push(cx+Math.cos(an)*r,cy+Math.sin(an)*r)}PL(a,p,true)}
function ELL(a,cx,cy,rx,ry,n=24,a0=0,a1=TAU){const p=[];for(let k=0;k<=n;k++){const an=a0+(a1-a0)*k/n;p.push(cx+Math.cos(an)*rx,cy+Math.sin(an)*ry)}PL(a,p,false)}
const CIR=(a,cx,cy,r,n=20)=>ELL(a,cx,cy,r,r,n);
function TF(a,st,tx,ty,rot,s){const co=Math.cos(rot)*s,si=Math.sin(rot)*s;for(let k=st;k<a.length;k+=2){const px=a[k],py=a[k+1];a[k]=tx+px*co-py*si;a[k+1]=ty+px*si+py*co}}
function alongPL(p,q){let tot=0;const ls=[];for(let k=0;k+3<p.length;k+=2){const l=Math.hypot(p[k+2]-p[k],p[k+3]-p[k+1]);ls.push(l);tot+=l}let d=q*tot;for(let k=0;k<ls.length;k++){if(d<=ls[k]){const f=d/ls[k];return[lerp(p[2*k],p[2*k+2],f),lerp(p[2*k+1],p[2*k+3],f)]}d-=ls[k]}return[p[p.length-2],p[p.length-1]]}
function perim(f,w,h){const Lt=2*(w+h);let d=f*Lt;if(d<w)return[d,0];d-=w;if(d<h)return[w,d];d-=h;if(d<w)return[w-d,h];d-=w;return[0,h-d]}
function stroke3(col,w,a){x.strokeStyle=col;x.globalAlpha=a*.16;x.lineWidth=w*5;x.stroke();x.globalAlpha=a*.85;x.lineWidth=w;x.stroke();x.strokeStyle=COL.white;x.globalAlpha=a*.5;x.lineWidth=Math.max(.6,w*.35);x.stroke();x.globalAlpha=1}
function segPath(s,rev){const n=s.length/4,heads=[];for(let k=0;k<n;k++){const st=k/n*.82,f=rev>=1?1:seg(rev,st,st+.18);if(f<=0)continue;const i=k*4;x.moveTo(s[i],s[i+1]);const ex=lerp(s[i],s[i+2],f),ey=lerp(s[i+1],s[i+3],f);x.lineTo(ex,ey);if(f<1&&heads.length<80)heads.push(ex,ey)}return heads}
function backdrop(cx,cy,rx,ry,a){if(a<=0)return;x.save();x.globalCompositeOperation='source-over';x.translate(cx,cy);x.scale(rx/ry,1);const g=x.createRadialGradient(0,0,0,0,0,ry);g.addColorStop(0,`rgba(5,2,1,${.82*a})`);g.addColorStop(.6,`rgba(5,2,1,${.6*a})`);g.addColorStop(1,'rgba(5,2,1,0)');x.fillStyle=g;x.fillRect(-ry,-ry,ry*2,ry*2);x.restore()}

// ================= logo (stylised starburst)
const LR=[1,.74,.9,.68,.97,.8,.88,.7,1,.76,.93,.72],LA=LR.map((_,k)=>k*Math.PI/6+((k*7)%5-2)*.035);
function logoP(p,cx,cy,size,rot){const k=(p.r*12)|0,Lk=LR[k]*size,l=(.1+.9*p.r2)*Lk,hw=size*.085*(1-Math.pow(l/Lk,2)),off=(p.r4*2-1)*hw,an=LA[k]+rot;
  return[cx+Math.cos(an)*l-Math.sin(an)*off,cy+Math.sin(an)*l+Math.cos(an)*off]}
function drawLogo(cx,cy,size,rot,a,fillA=.25){if(a<=0||size<=0)return;x.save();x.translate(cx,cy);x.rotate(rot);x.globalCompositeOperation='lighter';x.lineJoin='round';
  for(let k=0;k<12;k++){const Lk=LR[k]*size,hw=size*.085;x.save();x.rotate(LA[k]);x.beginPath();x.moveTo(0,-hw);x.bezierCurveTo(Lk*.45,-hw,Lk*.85,-hw*.35,Lk,0);x.bezierCurveTo(Lk*.85,hw*.35,Lk*.45,hw,0,hw);x.closePath();
    x.globalAlpha=a*fillA;x.fillStyle=k%2?COL.coral:COL.neon;x.fill();x.globalAlpha=a;x.strokeStyle=COL.neon;x.lineWidth=Math.max(1.5,size*.012);x.stroke();x.restore()}
  const g=x.createRadialGradient(0,0,0,0,0,size*.25);g.addColorStop(0,rgba(COL.white,a));g.addColorStop(.4,rgba(COL.amber,a*.5));g.addColorStop(1,rgba(COL.neon,0));x.fillStyle=g;x.globalAlpha=1;x.fillRect(-size*.25,-size*.25,size*.5,size*.5);x.restore()}

// ================= kinetic text
function kword(str,px0,py,size,u,{align='center',stag=.03,dur=.38,out=0,wt=700}={}){
  if(u<=0||out>=1)return;x.save();x.font=`${wt} ${size}px SG`;x.textBaseline='middle';x.textAlign='left';
  const ch=[...str],ws=ch.map(q=>x.measureText(q).width),sp=size*.015,tot=ws.reduce((a,b)=>a+b,0)+sp*(ch.length-1);
  let px=align=='center'?px0-tot/2:align=='left'?px0:px0-tot;x.globalCompositeOperation='lighter';
  ch.forEach((q,i)=>{const p=(u-i*stag)/dur;if(p>0){const e=back(p),a=cl(p*3,0,1)*(1-out),f=ch.length>1?i/(ch.length-1):0;
    const col=f<.5?mix(COL.hot,COL.neon,f*2):mix(COL.neon,COL.amber,f*2-1);
    x.save();x.translate(px+ws[i]/2,py+(1-e)*size*.55);x.rotate((1-e)*.35);const sc=lerp(.3,1,e);x.scale(sc,sc);
    x.globalAlpha=a;x.fillStyle=col;x.fillText(q,-ws[i]/2,0);x.globalAlpha=a*.3;x.strokeStyle=COL.white;x.lineWidth=Math.max(1,size/90);x.strokeText(q,-ws[i]/2,0);x.restore()}
    px+=ws[i]+sp});x.restore()}
function fitSize(s,max,w){x.font=`700 ${max}px SG`;const m=x.measureText(s).width;return m>w?max*w/m:max}

// ================= background
function bg(t){
  x.globalCompositeOperation='source-over';x.globalAlpha=1;x.fillStyle='#070404';x.fillRect(-60,-60,W+120,H+120);
  const g=x.createRadialGradient(CX+Math.sin(t*.3)*220,CY-60,0,CX,CY,1150);g.addColorStop(0,'rgba(120,46,26,.45)');g.addColorStop(.45,'rgba(60,22,14,.25)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++){const bx=W*(.5+.45*Math.sin(t*.17+i*2.1)),by=H*(.5+.4*Math.cos(t*.13+i*1.7)),br=180+i*40,gg=x.createRadialGradient(bx,by,0,bx,by,br);gg.addColorStop(0,rgba(i%2?COL.coral:COL.amber,.07));gg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gg;x.fillRect(bx-br,by-br,br*2,br*2)}
  const S=Sx(t),hz=770;x.lineWidth=1.5;
  for(let k=0;k<16;k++){const z=frac(k/16+S*.35),y=hz+Math.pow(z,2.4)*360;x.strokeStyle=rgba(COL.coral,.04+z*.28);x.beginPath();x.moveTo(-60,y);x.lineTo(W+60,y);x.stroke()}
  x.strokeStyle=rgba(COL.coral,.13);x.beginPath();for(let k=-24;k<=24;k++){x.moveTo(CX+k*30,hz);x.lineTo(CX+k*270,hz+380)}x.stroke();
  const hg=x.createLinearGradient(0,hz-40,0,hz+40);hg.addColorStop(0,'rgba(0,0,0,0)');hg.addColorStop(.5,rgba(COL.neon,.2));hg.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=hg;x.fillRect(-60,hz-40,W+120,80);
  const sp=spd(t);
  for(const s of STARS){const z=frac(s.z+S*.12*(.5+s.d)),z2=Math.max(0,z-.01*sp),k=1/(1.08-z)-.9,k2=1/(1.08-z2)-.9,r1=s.d*90*k,r2=s.d*90*k2,ca=Math.cos(s.a),sa=Math.sin(s.a);
    x.strokeStyle=s.c;x.globalAlpha=cl(z*1.4,0,1)*.65;x.lineWidth=.6+z*2;x.beginPath();x.moveTo(CX+ca*r2*1.6,CY+sa*r2);x.lineTo(CX+ca*r1*1.6+.5,CY+sa*r1);x.stroke()}
  x.globalAlpha=1}

// ================= scene 1: dust / logo
function dustPts(t){const o=new Float32Array(2*N);for(let i=0;i<N;i++){const p=P[i],z=.3+p.r3*.7,a=p.r*TAU+t*.08*(p.r4-.5),rad=(.15+p.r2)*900;o[2*i]=CX+Math.cos(a)*rad*.78/z;o[2*i+1]=CY+Math.sin(a)*rad*.48/z}return o}
function logoPts(t){const o=new Float32Array(2*N),s=240*(1+.03*Math.sin(t*4));for(let i=0;i<N;i++){const q=logoP(P[i],CX,CY-40,s,t*.3);o[2*i]=q[0];o[2*i+1]=q[1]}return o}

// ================= scene 2: hive of agents
function hivePts(t){const o=new Float32Array(2*N),yaw=Math.sin(t*.5)*.14,cy=Math.cos(yaw),sy=Math.sin(yaw),hz=440-seg(t,3,5.5)*30;
  for(let i=0;i<N;i++){const col=i%50,row=(i/50)|0,X=(col-24.5)*72,dz=(31-row)*68+420-1500,X2=X*cy-dz*sy,Z2=1500+X*sy+dz*cy,wave=Math.sin(col*.35+t*3)*Math.cos(row*.28+t*2.2)*28;
    o[2*i]=CX+X2*820/Z2;o[2*i+1]=hz+(250+wave)*820/Z2}return o}
const TAGS=['refactor /api','write tests','migrate db','polish ui','perf audit','fix #4127','write docs','deploy edge'];
function hiveFx(t,pos,a){if(a<=0)return;x.globalCompositeOperation='lighter';
  x.beginPath();for(let j=0;j<170;j++){const i=(hash(j*3.7+Math.floor(t*4+j*.1)*.917)*N)|0,nb=hash(j*1.1)>.5?i+1:i+50;if(nb>=N||(nb==i+1&&i%50==49))continue;x.moveTo(pos[2*i],pos[2*i+1]);x.lineTo(pos[2*nb],pos[2*nb+1])}
  x.strokeStyle=COL.neon;x.globalAlpha=.5*a;x.lineWidth=1.4;x.stroke();
  for(let j=0;j<30;j++){const ph=frac(t*1.6+j*.383),i=(hash(j*9.1+Math.floor(t*1.6+j*.383)*1.37)*N)|0;x.strokeStyle=j%3?COL.neon:COL.amber;x.globalAlpha=(1-ph)*a;x.lineWidth=2;x.beginPath();x.arc(pos[2*i],pos[2*i+1],4+ph*36,0,TAU);x.stroke()}
  for(let j=0;j<8;j++){const i=1250+((j*5+3)%8)*41+(j%2)*50+4,px=pos[2*i],py=pos[2*i+1],ta=a*seg(t,3.7+j*.11,3.95+j*.11);if(ta<=0)continue;
    const lab=`agent-${String(300+i).padStart(4,'0')} ▸ ${TAGS[j]}`;x.font='700 15px JB';const tw=x.measureText(lab).width;
    x.globalAlpha=ta;x.globalCompositeOperation='source-over';x.fillStyle='rgba(18,8,5,.85)';rr(px+28,py-62,tw+20,28,14);x.fill();
    x.globalCompositeOperation='lighter';x.strokeStyle=COL.neon;x.lineWidth=1.5;x.stroke();x.beginPath();x.moveTo(px,py);x.lineTo(px+28,py-48);x.stroke();
    x.fillStyle=COL.cream;x.textAlign='left';x.textBaseline='middle';x.fillText(lab,px+38,py-48)}
  x.globalAlpha=1}

// ================= scene 3: agent wall
const TASKS=['writing auth service','migrating schema','generating tests','refactoring api/','optimizing queries','building ui kit','fixing flaky test','reviewing PR #812','deploying edge fn','indexing docs','profiling hot path','writing e2e suite','scaffolding ios app','tuning shaders','updating deps','designing schema','load testing','i18n strings'];
function wallProj(t,X,Y){const camX=-150+(t-5.3)*230,Zb=1150-ei(seg(t,8.5,9.1))*1110,wx=X-camX,Z2=Zb+wx*.37;if(Z2<40)return null;return[CX-200+wx*.93*900/Z2,CY+Y*900/Z2,Z2]}
function drawWall(t){if(t<5.2||t>9.15)return;const al=seg(t,5.25,5.8)*(1-seg(t,8.85,9.12)),w=270,h=164;
  for(let col=-4;col<14;col++)for(let row=0;row<6;row++){const X=col*300,Y=(row-2.5)*190,A=wallProj(t,X-135,Y-82),B=wallProj(t,X+135,Y-82),C=wallProj(t,X-135,Y+82);if(!A||!B||!C)continue;
    if(Math.max(A[0],B[0])<-60||Math.min(A[0],B[0])>W+60)continue;
    const id=(col+4)*6+row,hs=hash(id*3.1),v=frac(hs+t*.35),done=v>.78,dep=A[2],fa=al*cl((3400-dep)/1400,0,1)*cl((dep-60)/220,0,1);if(fa<=.01)continue;
    x.setTransform((B[0]-A[0])/w,(B[1]-A[1])/w,(C[0]-A[0])/h,(C[1]-A[1])/h,A[0]+SH[0],A[1]+SH[1]);
    x.globalAlpha=fa;x.globalCompositeOperation='source-over';x.fillStyle='rgba(22,10,6,.9)';rr(0,0,w,h,14);x.fill();
    x.globalCompositeOperation='lighter';x.strokeStyle=done?COL.amber:COL.neon;x.lineWidth=2.5;x.globalAlpha=fa*(.6+.4*Math.sin(t*6+id));x.stroke();x.globalAlpha=fa;
    x.fillStyle=done?COL.amber:COL.neon;x.beginPath();x.arc(18,20,5,0,TAU);x.fill();
    x.font='700 15px JB';x.textAlign='left';x.textBaseline='middle';x.fillStyle=COL.cream;x.fillText('agent-'+String(100+id*7).padStart(4,'0'),32,20);
    x.textAlign='right';x.font='700 12px JB';x.fillStyle=done?COL.amber:COL.peach;x.fillText(done?'DONE ✓':'RUNNING',w-14,20);
    x.textAlign='left';x.font='500 13px JB';x.fillStyle=COL.peach;x.fillText('▸ '+TASKS[id%TASKS.length],14,46);
    const sc=t*40+id*17;for(let l=0;l<6;l++){const li=Math.floor(sc/16)+l,yy=64+l*16-(sc%16);if(yy<60||yy>132)continue;x.fillStyle=l%2?rgba(COL.coral,.55):rgba(COL.amber,.45);x.fillRect(14+(hash(li+id*2)*3|0)*12,yy,40+hash(li*1.3+id)*170,7)}
    x.fillStyle='rgba(255,255,255,.08)';x.fillRect(14,h-18,w-28,5);x.fillStyle=done?COL.amber:COL.neon;x.fillRect(14,h-18,(w-28)*(done?1:v/.78),5)}
  x.setTransform(1,0,0,1,SH[0],SH[1]);x.globalAlpha=1}
function wallPts(t){const o=new Float32Array(2*N);for(let i=0;i<N;i++){const p=P[i];let X,Y;
    if(p.r3<.55){const a=(p.r*40)|0,b=(p.r4*40)|0,ph=frac(p.r2+t*.7),e=eio(ph);X=lerp((a%10)*300,(b%10)*300,e);Y=lerp(((a/10|0)-1.5)*190,((b/10|0)-1.5)*190,e)-Math.sin(ph*Math.PI)*120}
    else{const cc=(p.r*60)|0,[ox,oy]=perim(frac(p.r2+t*.25*(p.r4>.5?1:-1)),270,164);X=(cc%10)*300-135+ox;Y=((cc/10|0)-2.5)*190-82+oy}
    const q=wallProj(t,X,Y);if(q){o[2*i]=q[0];o[2*i+1]=q[1]}else{o[2*i]=CX+(p.r-.5)*3000;o[2*i+1]=CY+(p.r2-.5)*2000}}return o}

// ================= builds
function geoWeb(u,t){const a=[];
  RR(a,-450,-290,900,580,20);L(a,-450,-238,450,-238);for(let i=0;i<3;i++)CIR(a,-418+i*24,-264,7,10);RR(a,-250,-277,500,26,13);
  R_(a,-410,-212,110,30);for(let i=0;i<4;i++)L(a,130+i*75,-197,180+i*75,-197);
  R_(a,-410,-150,480,40);R_(a,-410,-98,360,40);L(a,-410,-30,40,-30);L(a,-410,-8,-30,-8);RR(a,-410,24,180,50,25);RR(a,-210,24,150,50,25);
