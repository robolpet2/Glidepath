<script type="module">
import { render, outCanvas, DUR } from './film.js';
import { buildScore } from './score.js';
const CAPTURE = /[?&]capture\b/.test(location.search);
if (CAPTURE) document.documentElement.classList.add('capture');
document.body.prepend(outCanvas);

function wav(buf) {
  const ch = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate, dv = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const s = (o, t) => [...t].forEach((c, i) => dv.setUint8(o + i, c.charCodeAt(0)));
  s(0, 'RIFF'); dv.setUint32(4, 36 + len * ch * 2, true); s(8, 'WAVE'); s(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true);
  dv.setUint16(22, ch, true); dv.setUint32(24, sr, true); dv.setUint32(28, sr * ch * 2, true); dv.setUint16(32, ch * 2, true); dv.setUint16(34, 16, true);
  s(36, 'data'); dv.setUint32(40, len * ch * 2, true);
  const d = [...Array(ch)].map((_, i) => buf.getChannelData(i)); let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { dv.setInt16(o, Math.max(-1, Math.min(1, d[c][i])) * 32767, true); o += 2; }
  return new Uint8Array(dv.buffer);
}
window.renderFrame = t => { render(t); return outCanvas.toDataURL('image/jpeg', .94); };
window.renderAudio = async () => {
  const ac = new OfflineAudioContext(2, 48000 * DUR, 48000);
  buildScore(ac, ac.destination, 0, DUR);
  const b = wav(await ac.startRendering()); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
};
await document.fonts.load('700 100px Oswald'); await document.fonts.load('500 20px "JetBrains Mono"'); await document.fonts.load('700 20px "JetBrains Mono"');

btn.disabled = false; btn.textContent = '▶ Play trailer';
btn.addEventListener('click', () => {
  btn.style.display = 'none';
  const ac = new AudioContext(), T0 = ac.currentTime + .2;
  buildScore(ac, ac.destination, T0, DUR);
  const loop = () => {
    const t = ac.currentTime - T0;
    render(Math.max(0, t));
    if (t < DUR) requestAnimationFrame(loop); else { ac.close(); btn.textContent = '↻ Replay'; btn.style.display = ''; }
  };
  loop();
});
</script>
</body>
</html>
