<canvas id="c" width="1920" height="1080"></canvas>
<button id="play" type="button">▶ Play trailer</button>
<script>
/* GLIDEPATH — 35 second trailer.
   Everything here is original motion graphics drawn on a canvas: no game footage,
   models or textures. render(t) is a pure function of time, so the same frame can be
   played live in the browser or captured frame-by-frame for video (see render.js). */
'use strict';
const W = 1920, H = 1080, DUR = 35;
const CAPTURE = /[?&]capture\b/.test(location.search);
if (CAPTURE) document.documentElement.classList.add('capture');
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const C = { ink:'#0e1014', red:'#E10600', redDeep:'#b00400', off:'#F2F1ED', gold:'#e8b44a', cyan:'#38d4f0', green:'#6fd88a' };
const DISPLAY = 'Oswald, "Arial Narrow", Impact, sans-serif';
const MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';

/* ---------- maths ---------- */
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t * t;
const expo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const mod = (a, n) => ((a % n) + n) % n;
function rng(s) {
  return function () {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- shared assets (all generated, seeded) ---------- */
const grain = [0, 1, 2].map(i => {

function blob(cx, cy, R, seed, n = 140) {

}

function poly(pts, scale, cx, cy) {

const SHAKES = [[3.2, 6], [8.0, 5], [13.4, 7], [16.9, 12], [17.0, 12], [18.8, 20], [20.6, 5], [24.2, 9], [25.4, 4], [27.8, 34], [30.2, 12]];
const FLASHES = [[3.2, .55, '255,255,255', 1], [8.0, .3, '255,240,220', .8], [9.8, .22, '255,255,255', .6], [11.6, .22, '255,200,160', .6],
  [13.4, .35, '225,6,0', .7], [18.8, .3, '255,220,170', .6], [20.6, .3, '56,212,240', .5], [24.2, .25, '255,140,90', .35],
  [25.4, .3, '255,255,255', .7], [27.8, 1.0, '255,255,255', 1], [29.6, .35, '255,255,255', .8]];
const WIPES = [9.8, 11.6, 13.4, 20.6, 25.4];
function render(t) {
  t = clamp(t, 0, DUR);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  let amp = 0;
  for (const [ts, a] of SHAKES) if (t >= ts) amp += a * Math.exp(-(t - ts) * 5);
  const sx = amp * (Math.sin(t * 97) + Math.sin(t * 61.3)) * .5, sy = amp * (Math.sin(t * 83.1) + Math.sin(t * 47.7)) * .5;
  const zs = 1 + amp / 700;
  g.save();
  g.translate(W / 2 + sx, H / 2 + sy); g.scale(zs, zs); g.translate(-W / 2, -H / 2);
  if (t < 3.2) sceneRadar(t);
  else if (t < 8.0) sceneTakeoff(t);
  else if (t < 13.4) sceneWorld(t);
  else if (t < 20.6) sceneCombat(t);
  else if (t < 25.4) sceneCommand(t);
  else if (t < 29.6) sceneBoom(t);
  else sceneTitle(t);
  g.restore();
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.letterSpacing = '0px';
  // slash wipes: an ink and red bar sweeps across each cut
  for (const w of WIPES) {
    const p = (t - (w - .14)) / .28;

    const x = lerp(-700, W + 300, eio(p));
    g.save(); g.transform(1, 0, -.35, 1, 0, 0); g.translate(H * .35, 0);
    g.fillStyle = C.ink; g.fillRect(x, -10, 380, H + 20);

    g.fillStyle = 'rgba(242,241,237,.9)'; g.fillRect(x - 10, -10, 6, H + 20);
    g.restore();
  }
  for (const [ts, d, c, a] of FLASHES) {
    if (t < ts || t > ts + d) continue;
    const k = Math.pow(1 - (t - ts) / d, 2) * a;
    g.fillStyle = `rgba(${c},${k})`; g.fillRect(0, 0, W, H);
  }
  g.drawImage(vignette, 0, 0);
  const gi = Math.floor(t * 12);
  g.save(); g.translate((gi * 73) % 256, (gi * 151) % 256); g.fillStyle = grain[gi % 3]; g.fillRect(-256, -256, W + 512, H + 512); g.restore();

  const fade = Math.max(1 - seg(t, 0, .35), seg(t, DUR - .7, DUR));
  if (fade > 0) { g.fillStyle = `rgba(0,0,0,${fade})`; g.fillRect(0, 0, W, H); }
}

/* =================================================================
   score — synthesised with Web Audio, beat grid 100 bpm from 3.2 s
   ================================================================= */
function buildScore(ac, out, T0) {
  const at = s => T0 + s;
  const nf = m => 440 * Math.pow(2, (m - 69) / 12);
  const nr = rng(2024);
  const noise = ac.createBuffer(2, ac.sampleRate * 3, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = noise.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = nr() * 2 - 1; }
  const ir = ac.createBuffer(2, ac.sampleRate * 3, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (nr() * 2 - 1) * Math.pow(1 - i / d.length, 3.2); }
  const comp = ac.createDynamicsCompressor();

  const master = ac.createGain(); master.gain.value = .75;
  master.gain.setValueAtTime(.75, at(DUR - 1.0)); master.gain.linearRampToValueAtTime(0, at(DUR));
  master.connect(comp); comp.connect(out);
  const rev = ac.createConvolver(); rev.buffer = ir; const revOut = ac.createGain(); revOut.gain.value = .5; rev.connect(revOut); revOut.connect(master);
  const delay = ac.createDelay(1); delay.delayTime.value = .45; const fb = ac.createGain(); fb.gain.value = .38;
  delay.connect(fb); fb.connect(delay); const dOut = ac.createGain(); dOut.gain.value = .5; delay.connect(dOut); dOut.connect(master); dOut.connect(rev);

  function vca(t, a, peak, d, dest = master, sendRev = 0) {
    const gn = ac.createGain();
    gn.gain.setValueAtTime(0, at(t)); gn.gain.linearRampToValueAtTime(peak, at(t + a));
    gn.gain.exponentialRampToValueAtTime(.0001, at(t + a + d));
    gn.connect(dest);
    if (sendRev) { const s = ac.createGain(); s.gain.value = sendRev; gn.connect(s); s.connect(rev); }
    return gn;
  }
  function src(t, dur) { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; s.start(at(t), nr() * 2); s.stop(at(t + dur + .05)); return s; }
  function osc(type, f, t, dur) { const o = ac.createOscillator(); o.type = type; o.frequency.value = f; o.start(at(t)); o.stop(at(t + dur + .05)); return o; }
  function kick(t, v = .9, f0 = 140) {
    const o = osc('sine', f0, t, .5); o.frequency.setValueAtTime(f0, at(t)); o.frequency.exponentialRampToValueAtTime(42, at(t + .14));
    o.connect(vca(t, .003, v, .42));
  }
  function snare(t, v = .35) {
    const n = src(t, .3); const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = .7;
    n.connect(bp); bp.connect(vca(t, .002, v, .2, master, .25));
    const o = osc('triangle', 190, t, .15); o.connect(vca(t, .002, v * .6, .1));
  }
  function hat(t, v = .08) {
    const n = src(t, .1); const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7500;
    n.connect(hp); hp.connect(vca(t, .001, v, .045));
  }
  function boom(t, v = 1, len = 1.6) {
    const o = osc('sine', 75, t, len); o.frequency.setValueAtTime(75, at(t)); o.frequency.exponentialRampToValueAtTime(26, at(t + len));
    o.connect(vca(t, .005, v, len));
    const n = src(t, len); const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1200, at(t)); lp.frequency.exponentialRampToValueAtTime(70, at(t + len * .8));
    n.connect(lp); lp.connect(vca(t, .004, v * .9, len * .9, master, .3));
  }
  function crash(t, v = .3, len = 1.8) {
    const n = src(t, len); const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
    n.connect(hp); hp.connect(vca(t, .002, v, len, master, .5));
  }
  function stab(t, notes, v = .07, len = 1.4, cut = 1800) {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(cut, at(t)); lp.frequency.exponentialRampToValueAtTime(cut * .2, at(t + len));
    lp.connect(vca(t, .01, v, len, master, .4));
    notes.forEach(m => [-8, 8].forEach(dt => { const o = osc('sawtooth', nf(m), t, len); o.detune.value = dt; o.connect(lp); }));
  }
  function hit(t, v = 1) { boom(t, v, 1.8); crash(t, .28 * v, 2); stab(t, [26, 38, 45, 50, 53], .06 * v, 1.6); }
  function pad(t0, t1, notes, v = .05, cut = 1200) {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cut; lp.Q.value = .5;
    const gn = ac.createGain();
    gn.gain.setValueAtTime(0, at(t0)); gn.gain.linearRampToValueAtTime(v, at(t0 + .6));
    gn.gain.setValueAtTime(v, at(t1 - .3)); gn.gain.linearRampToValueAtTime(0, at(t1 + .4));
    lp.connect(gn); gn.connect(master); const s = ac.createGain(); s.gain.value = .5; gn.connect(s); s.connect(rev);
    notes.forEach(m => [-7, 7].forEach(dt => { const o = osc('sawtooth', nf(m), t0, t1 - t0 + .5); o.detune.value = dt; o.connect(lp); }));
  }
  function bass(t, m, v = .22, len = .26) {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 4;
    lp.frequency.setValueAtTime(1100, at(t)); lp.frequency.exponentialRampToValueAtTime(140, at(t + len));
    lp.connect(vca(t, .004, v, len));
    const o = osc('sawtooth', nf(m), t, len); o.connect(lp);
    const sub = osc('sine', nf(m - 12), t, len); sub.connect(vca(t, .004, v * .8, len));
  }
  function ping(t, m, v = .08, len = .7) {
    const o = osc('sine', nf(m), t, len); const gn = vca(t, .002, v, len, master, .2); o.connect(gn);
    const s = ac.createGain(); s.gain.value = .8; gn.connect(s); s.connect(delay);
    const o2 = osc('triangle', nf(m + 12), t, len * .5); o2.connect(vca(t, .002, v * .25, len * .5));
  }
  function beep(t, f, d, v = .07) {
    const o = osc('square', f, t, d); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
    o.connect(lp); const gn = ac.createGain(); gn.gain.setValueAtTime(0, at(t)); gn.gain.linearRampToValueAtTime(v, at(t + .005));
    gn.gain.setValueAtTime(v, at(t + d - .01)); gn.gain.linearRampToValueAtTime(0, at(t + d)); lp.connect(gn); gn.connect(master);
  }
  function whoosh(t, dur, v = .3, f0 = 300, f1 = 4000, pan0 = 0, pan1 = 0) {
    const n = src(t, dur); const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(f0, at(t)); bp.frequency.exponentialRampToValueAtTime(f1, at(t + dur));
    const gn = ac.createGain(); gn.gain.setValueAtTime(0, at(t)); gn.gain.linearRampToValueAtTime(v, at(t + dur * .7)); gn.gain.linearRampToValueAtTime(0, at(t + dur));
    const p = ac.createStereoPanner(); p.pan.setValueAtTime(pan0, at(t)); p.pan.linearRampToValueAtTime(pan1, at(t + dur));
    n.connect(bp); bp.connect(gn); gn.connect(p); p.connect(master);
  }
  function roar(t0, t1, v0, v1, f0, f1) {
    const n = src(t0, t1 - t0); const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.5;
    lp.frequency.setValueAtTime(f0, at(t0)); lp.frequency.exponentialRampToValueAtTime(f1, at(t1));
    const gn = ac.createGain(); gn.gain.setValueAtTime(.0001, at(t0)); gn.gain.linearRampToValueAtTime(v0, at(t0 + .4));
    gn.gain.linearRampToValueAtTime(v1, at(t1 - .05)); gn.gain.linearRampToValueAtTime(0, at(t1));
    n.connect(lp); lp.connect(gn); gn.connect(master);
    const o = osc('sawtooth', f0 * .3, t0, t1 - t0); o.frequency.exponentialRampToValueAtTime(f1 * .25, at(t1));
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 6;
    const og = ac.createGain(); og.gain.setValueAtTime(0, at(t0)); og.gain.linearRampToValueAtTime(v1 * .12, at(t1 - .05)); og.gain.linearRampToValueAtTime(0, at(t1));
    o.connect(bp); bp.connect(og); og.connect(master);
  }
  const B = .6, G0 = 3.2;               // beat length and grid origin
  const beat = n => G0 + n * B;

  // A · radar: drone, heartbeat, pings, typing
  pad(0, 3.3, [26, 38, 45], .06, 380);
  [.2, .45, 1.2, 1.45, 2.2, 2.45].forEach((s, i) => kick(s, i % 2 ? .45 : .7, 90));
  [[.62, 81], [1.55, 84], [2.1, 88]].forEach(([s, m]) => ping(s, m, .06));
  for (let i = 0; i < 27; i++) hat(.3 + i * (1.5 / 27), .05);
  whoosh(2.1, 1.1, .35, 200, 6000);
  // B · takeoff
  hit(3.2);
  pad(3.2, 8.0, [38, 45, 50, 53, 57], .045, 1300);
  roar(3.4, 8.0, .08, .34, 260, 2600);
  for (let n = 2; n < 16; n++) for (let e = 0; e < 2; e++) bass(beat(n) + e * B / 2, 38 + (e ? 12 : 0), .16);
  [4, 5, 6, 7].forEach(n => kick(beat(n * 2)));
  whoosh(beat(3.5) - .3, .9, .25, 400, 3000, -.5, .5);
  // C · regions
  hit(8.0, .85);
  [[8.0, [34, 46, 50, 53, 58]], [9.8, [29, 41, 48, 53, 57]], [11.6, [36, 43, 52, 55, 60]]].forEach(([s, ch]) => pad(s, s + 1.8, ch, .045, 1600));
  for (let n = 8; n < 17; n++) {
    kick(beat(n)); if (n % 2) snare(beat(n), .28);
    hat(beat(n) + B / 2, .07); hat(beat(n), .04);
    const root = n < 11 ? 34 : n < 14 ? 41 : 36;
    bass(beat(n), root + 12, .16); bass(beat(n) + B / 2, root + 12, .12);
  }
  [9.8, 11.6].forEach(s => { whoosh(s - .35, .5, .35, 600, 5000, -.8, .8); crash(s, .14, 1); kick(s, .8); });
  // D · combat: driving 16ths
  hit(13.4, 1.05);
  pad(13.4, 20.6, [26, 38, 45, 50, 53], .04, 900);
  for (let n = 17; n < 29; n++) {
    const s = beat(n);
    kick(s); if (n % 4 === 3) kick(s + B * .75, .6);
    if (n % 2 === 0) snare(s, .34);
    for (let k = 0; k < 4; k++) hat(s + k * B / 4, k % 2 ? .05 : .08);
    const riff = [38, 38, 50, 38, 41, 38, 48, 38];
    for (let k = 0; k < 2; k++) bass(s + k * B / 2, riff[(n * 2 + k) % 8], .18, .2);
  }
  for (let k = 0; k < 4; k++) snare(20.0 + k * .15, .2 + k * .06);
  [14.4, 14.8].forEach((s, i) => whoosh(s, 1.4, .26, 200, 2400, i ? -.6 : .6, 0));
  for (let s = 14.55; s < 17.0; s += .3) { beep(s, 980, .13); beep(s + .15, 760, .13); }
  for (let i = 0; i < 6; i++) hat(16.05 + i * .05, .15);
  boom(16.9, .75, 1.3); crash(16.9, .2, 1.2); boom(17.0, .85, 1.5);
  for (let s = 17.45; s < 18.1; s += .08) beep(s, 1500, .05, .05);
  beep(18.1, 1500, .25, .06);
  whoosh(18.35, .5, .3, 500, 5000, -.3, .6);
  boom(18.8, 1.1, 1.9); crash(18.8, .3, 1.8);
  // E · command: arpeggio over a half-time pulse
  hit(20.6, .8);
  [[20.6, [34, 46, 50, 53, 58]], [23.0, [36, 48, 52, 55, 60]]].forEach(([s, ch]) => pad(s, s + 2.4, ch, .04, 2200));
  const arp = [62, 65, 69, 74, 72, 69, 65, 69];
  for (let i = 0; i < 32; i++) ping(20.6 + i * B / 4, arp[i % 8] + (i >= 16 ? 2 : 0), .045, .35);
  for (let n = 29; n < 37; n += 2) { kick(beat(n), .7); snare(beat(n + 1), .18); }
  for (let n = 29; n < 37; n++) bass(beat(n), n < 33 ? 46 : 48, .14, .4);
  [20.9, 22.5, 24.1].forEach(s => whoosh(s, .8, .08, 2000, 400));
  for (let i = 0; i < 4; i++) whoosh(22.4 + i * .03, 1.8, .14, 150, 1800, -.4 + i * .25, .4);
  boom(24.2, .9, 1.6); crash(24.2, .2, 1.4);
  // F · sound barrier
  boom(25.4, .5, 1); crash(25.4, .12, 1);
  roar(25.4, 27.8, .14, .5, 300, 5200);
  const riser = osc('sawtooth', 60, 25.4, 2.4); riser.frequency.exponentialRampToValueAtTime(700, at(27.8));
  const rlp = ac.createBiquadFilter(); rlp.type = 'lowpass'; rlp.frequency.setValueAtTime(300, at(25.4)); rlp.frequency.exponentialRampToValueAtTime(5000, at(27.8));
  const rg = ac.createGain(); rg.gain.setValueAtTime(0, at(25.4)); rg.gain.linearRampToValueAtTime(.09, at(27.78)); rg.gain.linearRampToValueAtTime(0, at(27.8));
  riser.connect(rlp); rlp.connect(rg); rg.connect(master);
  for (let i = 0; i < 16; i++) kick(25.4 + i * (2.4 / 16) * (1 - i / 40), .25 + i * .03, 110);
  boom(27.8, 1.3, 2.8); crash(27.8, .4, 2.6); stab(27.8, [26, 38, 50, 57, 62], .07, 2.4, 2400);
  pad(28.1, 29.7, [62, 65, 69, 76], .035, 3000);
  whoosh(28.8, .85, .35, 200, 7000);
  // G · title
  whoosh(29.55, .7, .45, 300, 4000, -1, 1);
  hit(30.2, 1.15);
  pad(30.2, 34.6, [26, 38, 45, 50, 53, 57, 64], .05, 1500);
  ping(31.0, 74, .05, 1.2); ping(32.2, 77, .04, 1.2); ping(33.4, 81, .035, 1.4);
}

function wav(buf) {
  const ch = buf.numberOfChannels, len = buf.length, sr = buf.sampleRate;
  const out = new DataView(new ArrayBuffer(44 + len * ch * 2));
  const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); out.setUint32(4, 36 + len * ch * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true); out.setUint32(24, sr, true);
  out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true);
  str(36, 'data'); out.setUint32(40, len * ch * 2, true);
  const data = [...Array(ch)].map((_, i) => buf.getChannelData(i));
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < ch; c++) { out.setInt16(o, clamp(data[c][i], -1, 1) * 32767, true); o += 2; }
  return new Uint8Array(out.buffer);
}
window.renderFrame = t => { render(t); return cv.toDataURL('image/jpeg', .93); };
window.renderAudio = async () => {
  const ac = new OfflineAudioContext(2, 44100 * DUR, 44100);
  buildScore(ac, ac.destination, 0);
  const bytes = wav(await ac.startRendering());
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.trailerReady = document.fonts.ready.then(() => Promise.all([
  document.fonts.load('700 100px Oswald'), document.fonts.load('500 20px "JetBrains Mono"'), document.fonts.load('700 20px "JetBrains Mono"'),
]).catch(() => {})).then(() => { render(CAPTURE ? 0 : 31.8); return true; });

/* live playback */
const btn = document.getElementById('play');
let raf = 0;
btn.addEventListener('click', () => {
  btn.style.display = 'none';
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const T0 = ac.currentTime + .15;
  buildScore(ac, ac.destination, T0);
  cancelAnimationFrame(raf);
  const loop = () => {
    const t = ac.currentTime - T0;
    render(t);
    if (t < DUR) raf = requestAnimationFrame(loop);
    else { ac.close(); btn.textContent = '↻ Replay'; btn.style.display = ''; }
  };
  loop();
});
